<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHROMA KNIGHT — 稜鏡騎士</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="stage-shell">
      <div id="canvas-wrap">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="crt-overlay"></div>
        <div id="editor-ui"></div>
      </div>

      <div id="touch-controls" aria-label="行動端虛擬手把">
        <div class="touch-dpad">
          <button class="tbtn" data-key="ArrowLeft" aria-label="左">◀</button>
          <div class="touch-dpad-mid">
            <button class="tbtn small" data-key="ArrowUp" aria-label="上">▲</button>
            <button class="tbtn small" data-key="ArrowDown" aria-label="下/重擊">▼</button>
          </div>
          <button class="tbtn" data-key="ArrowRight" aria-label="右">▶</button>
        </div>
        <div class="touch-actions">
          <button class="tbtn phase" data-key="ShiftLeft">相位</button>
          <button class="tbtn dash" data-key="KeyX">衝刺</button>
          <button class="tbtn jump" data-key="Space">跳躍</button>
        </div>
      </div>

      <footer id="controls-bar">
        <span class="badge solar" id="phase-pill">SOLAR 熾陽</span>
        <button id="touch-toggle-btn" class="mini-btn" type="button">🎮 觸控手把</button>
        <span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> 移動</span>
        <span><kbd>Space</kbd> / <kbd>Z</kbd> 跳躍・蹬牆跳</span>
        <span><kbd>X</kbd> / <kbd>J</kbd> 衝刺</span>
        <span><kbd>Shift</kbd> / <kbd>K</kbd> / <kbd>E</kbd> 相位切換</span>
        <span><kbd>↓</kbd> 空中重擊</span>
        <span><kbd>F2</kbd> 關卡編輯</span>
        <span><kbd>G</kbd> Shader</span>
        <span><kbd>T</kbd> 殘影</span>
        <span><kbd>R</kbd> 重來</span>
        <span><kbd>M</kbd> 靜音</span>
        <span><kbd>F3</kbd> 除錯</span>
      </footer>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
