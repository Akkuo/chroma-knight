// Procedural Web Audio API chiptune & adaptive BGM engine

const NOTE_FREQ = {
  C3: 130.81, D3: 146.83, Eb3: 155.56, E3: 164.81, F3: 174.61, G3: 196.0, Ab3: 207.65, A3: 220.0, Bb3: 233.08, B3: 246.94,

  C5: 523.25, D5: 587.33, Eb5: 622.25, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.0, B5: 987.77,
  C6: 1046.5,
};

const SOLAR_MELODY = [
  'E5', null, 'G5', 'A5', 'G5', null, 'E5', 'D5',
  'C5', null, 'D5', 'E5', 'G5', null, 'D5', null,
  'E5', null, 'G5', 'A5', 'C6', null, 'B5', 'A5',
  'G5', 'E5', 'D5', 'E5', 'C5', null, null, null,
];

const SOLAR_BASS = [
  'C3', null, 'G3', null, 'A3', null, 'E3', null,
  'F3', null, 'C3', null, 'G3', null, 'D3', null,
  'C3', null, 'G3', null, 'A3', null, 'E3', null,
  'F3', null, 'G3', null, 'C3', null, 'G3', null,
];

const LUNAR_MELODY = [
  'A4', 'C5', 'E5', null, 'B4', 'D5', 'G5', null,
  'E5', null, 'D5', 'C5', 'B4', null, 'G4', null,
  'A4', 'C5', 'E5', 'A5', 'G5', null, 'E5', 'D5',
  'C5', null, 'B4', 'A4', 'E5', null, null, null,
];

const LUNAR_BASS = [
  'A3', null, 'E3', null, 'G3', null, 'D3', null,
  'F3', null, 'C3', null, 'E3', null, 'B3', null,
  'A3', null, 'E3', null, 'G3', null, 'D3', null,
  'F3', null, 'G3', null, 'A3', null, 'E3', null,
];

const BOSS_MELODY = [
  'E5', 'Eb5', 'E5', 'G5', 'E5', null, 'D5', 'C5',
  'B4', 'E5', 'G5', 'A5', 'G5', 'Fs4', 'E5', null,
  'A5', 'G5', 'E5', 'D5', 'C5', 'D5', 'E5', 'G5',
  'B5', null, 'A5', 'G5', 'E5', null, 'B4', null,
];

const BOSS_BASS = [
  'E3', 'E3', 'G3', 'E3', 'A3', 'E3', 'G3', 'Fs4',
  'E3', 'E3', 'B3', 'A3', 'G3', 'E3', 'D3', 'B3',
  'C3', 'C3', 'G3', 'C3', 'D3', 'D3', 'A3', 'D3',
  'E3', 'G3', 'A3', 'B3', 'E3', null, 'B3', null,
];
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
    this.bgmMode = 'solar'; // 'solar' | 'lunar' | 'boss' | 'off'
    this.step = 0;
    this.stepTimer = 0;
    this.unlocked = false;
  }

  unlock() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.28;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    this.unlocked = true;
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.master && this.ctx) {
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.28, this.ctx.currentTime, 0.02);
    }
    return this.muted;
  }

  setBgmMode(mode) {
    this.bgmMode = mode;
  }

  update(dt) {
    if (!this.unlocked || !this.ctx || this.muted || this.bgmMode === 'off') return;
    if (this.ctx.state !== 'running') return;

    const stepDuration = this.bgmMode === 'boss' ? 0.125 : 0.16;
    this.stepTimer += dt;
    if (this.stepTimer >= stepDuration) {
      this.stepTimer -= stepDuration;
      this._playBgmStep();
      this.step = (this.step + 1) % 32;
    }
  }

  _playBgmStep() {
    const isBoss = this.bgmMode === 'boss';
    const isLunar = this.bgmMode === 'lunar';
    const mel = isBoss ? BOSS_MELODY : isLunar ? LUNAR_MELODY : SOLAR_MELODY;
    const bas = isBoss ? BOSS_BASS : isLunar ? LUNAR_BASS : SOLAR_BASS;

    const mNote = mel[this.step];
    const bNote = bas[this.step];

    if (mNote && NOTE_FREQ[mNote]) {
      this._tone({
        freq: NOTE_FREQ[mNote],
        type: isLunar ? 'triangle' : isBoss ? 'sawtooth' : 'square',
        dur: isLunar ? 0.22 : 0.13,
        vol: isLunar ? 0.075 : 0.045,
        attack: 0.008,
      });
    }
    if (bNote && NOTE_FREQ[bNote]) {
      this._tone({
        freq: NOTE_FREQ[bNote],
        type: 'triangle',
        dur: 0.16,
        vol: isBoss ? 0.095 : 0.08,
        attack: 0.005,
      });
    }
    // Soft hi-hat / pulse percussion
    if (this.step % 2 === 1 && (isBoss || this.step % 4 === 3)) {
      this._noise(0.03, isBoss ? 0.032 : 0.014, 5200);
    }
  }

  _tone({ freq, freqEnd = null, type = 'square', dur = 0.12, vol = 0.16, attack = 0.005, delay = 0 }) {
    if (!this.ctx || !this.master || this.muted) return;
    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd !== null) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + dur);
    }
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol, now + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  _noise(dur = 0.08, vol = 0.12, filterFreq = 1800) {
    if (!this.ctx || !this.master || this.muted) return;
    const now = this.ctx.currentTime;
    const sampleCount = Math.floor(this.ctx.sampleRate * dur);
    const buffer = this.ctx.createBuffer(1, sampleCount, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < sampleCount; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const src = this.ctx.createBufferSource();
    src.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(filterFreq, now);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    src.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);
    src.start(now);
  }

  playJump(isLunar = false) {
    this._tone({ freq: isLunar ? 240 : 210, freqEnd: isLunar ? 620 : 520, type: 'square', dur: 0.13, vol: 0.13 });
  }

  playWallJump() {
    this._tone({ freq: 290, freqEnd: 690, type: 'triangle', dur: 0.11, vol: 0.16 });
  }

  playDash(isLunar = false) {
    this._noise(0.11, 0.15, isLunar ? 2800 : 1600);
    this._tone({ freq: isLunar ? 640 : 480, freqEnd: 150, type: 'sawtooth', dur: 0.12, vol: 0.12 });
  }

  playPhaseShift(toLunar) {
    const start = toLunar ? 580 : 320;
    const end = toLunar ? 310 : 660;
    this._tone({ freq: start, freqEnd: end, type: 'sine', dur: 0.17, vol: 0.18 });
    this._tone({ freq: start * 1.5, freqEnd: end * 1.5, type: 'triangle', dur: 0.15, vol: 0.1, delay: 0.02 });
  }

  playCoin(combo = 1) {
    const mult = Math.min(1.65, 1 + (combo - 1) * 0.08);
    this._tone({ freq: 988 * mult, type: 'square', dur: 0.07, vol: 0.11 });
    this._tone({ freq: 1318 * mult, type: 'square', dur: 0.14, vol: 0.11, delay: 0.055 });
  }

  playStomp(combo = 1) {
    const pitch = Math.min(2.0, 1 + (combo - 1) * 0.15);
    this._tone({ freq: 240 * pitch, freqEnd: 520 * pitch, type: 'square', dur: 0.11, vol: 0.16 });
    this._noise(0.05, 0.09, 1200);
  }

  playShellKick() {
    this._tone({ freq: 180, freqEnd: 460, type: 'sawtooth', dur: 0.09, vol: 0.16 });
    this._noise(0.06, 0.12, 900);
  }

  playBlockBump() {
    this._tone({ freq: 170, freqEnd: 95, type: 'triangle', dur: 0.09, vol: 0.18 });
  }

  playShatter() {
    this._noise(0.16, 0.19, 1400);
    this._tone({ freq: 220, freqEnd: 65, type: 'sawtooth', dur: 0.14, vol: 0.14 });
  }

  playSpring() {
    this._tone({ freq: 200, freqEnd: 780, type: 'sine', dur: 0.22, vol: 0.18 });
    this._tone({ freq: 300, freqEnd: 980, type: 'triangle', dur: 0.18, vol: 0.1, delay: 0.03 });
  }

  playGroundPound() {
    this._noise(0.18, 0.22, 420);
    this._tone({ freq: 140, freqEnd: 38, type: 'sawtooth', dur: 0.22, vol: 0.2 });
  }

  playDashCrystal() {
    this._tone({ freq: 660, freqEnd: 1180, type: 'triangle', dur: 0.12, vol: 0.15 });
    this._tone({ freq: 990, freqEnd: 1560, type: 'sine', dur: 0.14, vol: 0.12, delay: 0.04 });
  }

  playCheckpoint() {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((n, i) => {
      this._tone({ freq: n, type: 'triangle', dur: 0.18, vol: 0.14, delay: i * 0.065 });
    });
  }

  playPowerup() {
    const notes = [392, 523.25, 659.25, 783.99, 1046.5];
    notes.forEach((n, i) => {
      this._tone({ freq: n, type: 'square', dur: 0.11, vol: 0.12, delay: i * 0.05 });
    });
  }

  playHurt() {
    this._tone({ freq: 310, freqEnd: 90, type: 'sawtooth', dur: 0.24, vol: 0.18 });
    this._noise(0.15, 0.16, 700);
  }

  playBossHit() {
    this._noise(0.22, 0.22, 650);
    this._tone({ freq: 420, freqEnd: 110, type: 'sawtooth', dur: 0.26, vol: 0.2 });
    this._tone({ freq: 620, freqEnd: 880, type: 'square', dur: 0.14, vol: 0.12, delay: 0.08 });
  }

  playVictory() {
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    const delays = [0, 0.1, 0.2, 0.32, 0.48, 0.6];
    notes.forEach((n, i) => {
      this._tone({ freq: n, type: 'square', dur: i === notes.length - 1 ? 0.45 : 0.14, vol: 0.14, delay: delays[i] });
    });
  }
}

// === src/sprites.js ===
// Procedural 16-bit style Pixel Art Sprite & Tile Atlas Generator

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

function drawPixelArt(grid, palette, scale = 1) {
  const h = grid.length;
  const w = grid[0].length;
  const c = makeCanvas(w * scale, h * scale);
  const ctx = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = grid[y];
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      if (ch === '.' || ch === ' ') continue;
      const color = palette[ch];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(x * scale, y * scale, scale, scale);
    }
  }
  return c;
}

function flipH(src) {
  const c = makeCanvas(src.width, src.height);
  const ctx = c.getContext('2d');
  ctx.translate(src.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(src, 0, 0);
  return c;
}
function createSpriteAtlas() {

  atlas.tiles.lunarGhost = bakePhaseTile('#3ee0ff', '#2782e6', '#d8fcff', '#103875', false);

  // --- PLAYER SPRITES (16x18) ---
  const playerIdle = [
    '.....oooooo.....',

function bakeGroundTile(top, topDark, topHi, dirt, dirtDark, dirtHi) {
  const c = makeCanvas(16, 16);
  const ctx = c.getContext('2d');
  ctx.fillStyle = dirt;
  ctx.fillRect(0, 0, 16, 16);
  // Subtle brick/pebble noise
  ctx.fillStyle = dirtDark;
  ctx.fillRect(2, 7, 3, 2);
  ctx.fillRect(10, 9, 4, 2);
  ctx.fillRect(5, 13, 3, 2);
  ctx.fillStyle = dirtHi;
  ctx.fillRect(1, 6, 2, 1);
  ctx.fillRect(9, 8, 2, 1);
  ctx.fillRect(13, 13, 2, 1);
  // Grass cap
  ctx.fillStyle = topDark;
  ctx.fillRect(0, 0, 16, 5);
  ctx.fillStyle = top;
  ctx.fillRect(0, 0, 16, 4);
  ctx.fillStyle = topHi;
  ctx.fillRect(0, 0, 16, 1);
  ctx.fillRect(2, 1, 3, 1);
  ctx.fillRect(10, 1, 4, 1);
  // Overhang tufts
  ctx.fillStyle = topDark;
  ctx.fillRect(2, 5, 2, 1);
  ctx.fillRect(7, 5, 3, 1);
  ctx.fillRect(13, 5, 2, 1);
  return c;
}

function bakeDirtTile(base, dark, hi, deep) {
  const c = makeCanvas(16, 16);
  const ctx = c.getContext('2d');

  ctx.fillRect(0, 0, 16, 16);
  ctx.fillStyle = dark;
  ctx.fillRect(1, 3, 4, 2);
  ctx.fillRect(9, 1, 5, 2);
  ctx.fillRect(6, 9, 4, 3);
  ctx.fillRect(12, 12, 3, 2);
  ctx.fillStyle = hi;
  ctx.fillRect(2, 2, 2, 1);
  ctx.fillRect(10, 8, 2, 1);
  ctx.fillStyle = deep;
  ctx.fillRect(0, 15, 16, 1);

}

function bakeBrickTile() {
  const c = makeCanvas(16, 16);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#331c24';
  ctx.fillRect(0, 0, 16, 16);
  const bricks = [
    [1, 1, 6, 6],
    [8, 1, 7, 6],
    [0, 8, 3, 7],
    [4, 8, 7, 7],
    [12, 8, 4, 7],
  ];
  for (const [x, y, w, h] of bricks) {
    ctx.fillStyle = '#b55243';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#dc7a5c';
    ctx.fillRect(x, y, w, 1);
    ctx.fillRect(x, y, 1, h - 1);
    ctx.fillStyle = '#7d302f';
    ctx.fillRect(x, y + h - 1, w, 1);
  }
  return c;
}

function bakePhaseTile(main, mid, hi, dark, solid) {
  const c = makeCanvas(16, 16);
  const ctx = c.getContext('2d');
  if (solid) {
    ctx.fillStyle = dark;
    ctx.fillRect(0, 0, 16, 16);
    ctx.fillStyle = main;
    ctx.fillRect(1, 1, 14, 14);
    ctx.fillStyle = mid;
    ctx.fillRect(3, 3, 10, 10);
    ctx.fillStyle = hi;
    ctx.fillRect(1, 1, 14, 2);
    ctx.fillRect(1, 1, 2, 14);
    // Inner diamond emblem
    ctx.fillRect(7, 5, 2, 6);
    ctx.fillRect(5, 7, 6, 2);
  } else {
    ctx.strokeStyle = main;
    ctx.globalAlpha = 0.48;
    ctx.lineWidth = 1;
    ctx.strokeRect(1.5, 1.5, 13, 13);
    ctx.fillStyle = main;
    ctx.globalAlpha = 0.14;
    ctx.fillRect(2, 2, 12, 12);
    ctx.globalAlpha = 0.5;
    ctx.fillRect(7, 6, 2, 4);
    ctx.fillRect(6, 7, 4, 2);
  }
  return c;
}

// Particles, shatter debris, floating combat/score text, phase ripples, and interactive grass
class ParticleSystem {
  constructor() {
    this.particles = [];
    this.texts = [];
    this.ripples = [];
    this.afterimages = [];
    this.grass = [];
    this.ambient = [];
  }

  clear() {
    this.particles.length = 0;
    this.texts.length = 0;
    this.ripples.length = 0;
    this.afterimages.length = 0;
    this.grass.length = 0;
    this.ambient.length = 0;
  }

  initGrass(level) {
    this.grass.length = 0;
    for (let y = 1; y < level.height; y++) {
      for (let x = 0; x < level.width; x++) {
        if (level.getTile(x, y) === 1 && level.getTile(x, y - 1) === 0) {
          for (let i = 0; i < 3; i++) {
            this.grass.push({
              x: x * 16 + 2 + i * 5 + Math.random() * 2,
              y: y * 16,
              h: 4 + Math.random() * 4,
              angle: 0,
              vel: 0,
              phaseOffset: Math.random() * Math.PI * 2,
            });
          }
        }
      }
    }
  }

  initAmbient(widthPx, heightPx) {
    this.ambient.length = 0;
    for (let i = 0; i < 42; i++) {
      this.ambient.push({
        x: Math.random() * widthPx,
        y: Math.random() * heightPx,
        vx: (Math.random() - 0.5) * 10,
        vy: -4 - Math.random() * 10,
        size: Math.random() < 0.35 ? 2 : 1,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  burst(x, y, count, color, opts = {}) {
    const {
      speedMin = 20,
      speedMax = 110,
      lifeMin = 0.2,
      lifeMax = 0.55,
      gravity = 260,
      size = 2,
      glow = false,
      spread = Math.PI * 2,
      angleOffset = 0,
    } = opts;

    for (let i = 0; i < count; i++) {
      const a = angleOffset + (Math.random() - 0.5) * spread;
      const sp = speedMin + Math.random() * (speedMax - speedMin);
      this.particles.push({
        x,
        y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: lifeMin + Math.random() * (lifeMax - lifeMin),
        maxLife: lifeMax,
        gravity,
        size: Math.random() < 0.3 ? size + 1 : size,
        color,
        glow,
      });
    }
  }

  spawnDebris(x, y, color1, color2) {
    for (let i = 0; i < 8; i++) {
      this.particles.push({
        x: x + (Math.random() - 0.5) * 10,
        y: y + (Math.random() - 0.5) * 10,
        vx: (Math.random() - 0.5) * 170,
        vy: -120 - Math.random() * 130,
        life: 0.65 + Math.random() * 0.35,
        maxLife: 1.0,
        gravity: 680,
        size: 3 + (i % 2),
        color: i % 2 === 0 ? color1 : color2,
        glow: false,
      });
    }
  }

  spawnText(x, y, text, color = '#fff4a3') {
    this.texts.push({
      x,
      y,
      vy: -36,
      text,
      color,
      life: 0.85,
      maxLife: 0.85,
    });
  }

  spawnRipple(x, y, color, maxRadius = 260) {
    this.ripples.push({
      x,
      y,
      r: 6,
      maxRadius,
      color,
      life: 0.34,
      maxLife: 0.34,
    });
  }

  spawnAfterimage(x, y, sprite, tint) {
    this.afterimages.push({
      x,
      y,
      sprite,
      tint,
      life: 0.18,
      maxLife: 0.18,
    });
  }

  disturbGrass(x, y, vx) {
    for (let i = 0; i < this.grass.length; i++) {
      const g = this.grass[i];
      if (Math.abs(g.x - x) < 12 && Math.abs(g.y - y) < 14) {
        g.vel += Math.max(-18, Math.min(18, vx * 0.11));
      }
    }
  }

  update(dt, time, levelWidthPx, levelHeightPx) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
        continue;
      }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.life -= dt;
      if (t.life <= 0) {
        this.texts.splice(i, 1);
        continue;
      }
      t.y += t.vy * dt;
      t.vy *= 0.94;
    }

    for (let i = this.ripples.length - 1; i >= 0; i--) {
      const r = this.ripples[i];
      r.life -= dt;
      if (r.life <= 0) {
        this.ripples.splice(i, 1);
        continue;
      }
      const p = 1 - r.life / r.maxLife;
      r.r = 6 + (r.maxRadius - 6) * (1 - Math.pow(1 - p, 3));
    }

    for (let i = this.afterimages.length - 1; i >= 0; i--) {
      const a = this.afterimages[i];
      a.life -= dt;
      if (a.life <= 0) this.afterimages.splice(i, 1);
    }

    // Spring-damper physics on grass blades
    for (let i = 0; i < this.grass.length; i++) {
      const g = this.grass[i];
      const wind = Math.sin(time * 2.2 + g.phaseOffset) * 0.18;
      const target = wind;
      const force = (target - g.angle) * 48 - g.vel * 6.5;
      g.vel += force * dt;
      g.angle += g.vel * dt;
    }

    // Ambient fireflies / embers
    for (let i = 0; i < this.ambient.length; i++) {
      const a = this.ambient[i];
      a.x += (a.vx + Math.sin(time * 1.4 + a.phase) * 7) * dt;
      a.y += a.vy * dt;
      if (a.y < -8) {
        a.y = levelHeightPx + 4;
        a.x = Math.random() * levelWidthPx;
      }
      if (a.x < 0) a.x = levelWidthPx;
      if (a.x > levelWidthPx) a.x = 0;
    }
  }
}

class Level {
  constructor(def) {
    this.def = def;
    this.id = def.id;
    this.name = def.name;
    this.subtitle = def.subtitle;
    this.hint = def.hint;
    this.hasBoss = def.hasBoss;

    const rows = def.map;
    this.height = rows.length;
    this.width = rows[0].length;
    this.widthPx = this.width * TILE_SIZE;
    this.heightPx = this.height * TILE_SIZE;

    this.tiles = new Uint8Array(this.width * this.height);
    this.bumpOffsets = new Float32Array(this.width * this.height);
    this.crumbleTimers = new Map(); // tileIndex -> { state: 'shaking'|'gone', timer }

    this.spawn = { x: 48, y: 160 };
    this.goal = { x: (this.width - 4) * TILE_SIZE, y: 12 * TILE_SIZE };
    this.entitySpawns = [];
    this.bossArenaX = null;

    for (let y = 0; y < this.height; y++) {
      const row = rows[y];
      for (let x = 0; x < this.width; x++) {
        const ch = row[x] || '.';
        let t = TILE.EMPTY;
        const px = x * TILE_SIZE;
        const py = y * TILE_SIZE;

        switch (ch) {
          case '#': t = TILE.GROUND; break;
          case 'd': t = TILE.DIRT; break;
          case 'B': t = TILE.BRICK; break;
          case '?': t = TILE.QUESTION; break;
          case 'S': t = TILE.SOLAR_BLOCK; break;
          case 'L': t = TILE.LUNAR_BLOCK; break;
          case '^': t = TILE.SPIKE; break;
          case 'X': t = TILE.CRACKED; break;
          case '-': t = TILE.ONE_WAY; break;
          case 'C': t = TILE.CRUMBLE; break;
          case '~': t = TILE.WATER; break;
          case '!': t = TILE.LAVA; break;
          case '|': t = TILE.PILLAR; break;
          case 'P': this.spawn = { x: px, y: py - 2 }; break;
          case 'G':
            t = TILE.GOAL_GATE;
            this.goal = { x: px, y: py };
            break;
          case 'c': this.entitySpawns.push({ type: 'coin', x: px + 3, y: py + 3 }); break;
          case 'D': this.entitySpawns.push({ type: 'dash_crystal', x: px + 2, y: py + 2 }); break;
          case 'U': this.entitySpawns.push({ type: 'spring', x: px, y: py }); break;
          case 'K': this.entitySpawns.push({ type: 'checkpoint', x: px, y: py - 8 }); break;
          case 'e': this.entitySpawns.push({ type: 'slime', x: px, y: py + 2 }); break;
          case 't': this.entitySpawns.push({ type: 'beetle', x: px, y: py + 2 }); break;
          case 'w': this.entitySpawns.push({ type: 'wisp', x: px, y: py, phase: PHASE.SOLAR }); break;
          case 'v': this.entitySpawns.push({ type: 'wisp', x: px, y: py, phase: PHASE.LUNAR }); break;
          case 'H': this.entitySpawns.push({ type: 'heart', x: px + 3, y: py + 3 }); break;
          case '@':
            this.bossArenaX = (x - 10) * TILE_SIZE;
            this.entitySpawns.push({ type: 'boss', x: px - 8, y: py - 16 });
            break;
          default: break;
        }
        this.tiles[y * this.width + x] = t;
      }
    }

    // Add moving platforms in Stage 1 & 2 for extra kinetic variety
    if (this.id === 1) {
      this.entitySpawns.push({ type: 'platform', x: 28 * 16, y: 11 * 16, w: 48, rangeX: 56, rangeY: 0, speed: 1.5 });
    } else if (this.id === 2) {
      this.entitySpawns.push({ type: 'platform', x: 16 * 16, y: 12 * 16, w: 48, rangeX: 48, rangeY: 0, speed: 1.7 });
      this.entitySpawns.push({ type: 'platform', x: 56 * 16, y: 11 * 16, w: 48, rangeX: 0, rangeY: 42, speed: 1.6 });
    } else if (this.id === 3) {
      this.entitySpawns.push({ type: 'platform', x: 64 * 16, y: 11 * 16, w: 48, rangeX: 44, rangeY: 0, speed: 1.9 });
    }
  }

  getTile(tx, ty) {
    if (tx < 0 || tx >= this.width) return TILE.DIRT;
    if (ty < 0) return TILE.EMPTY;
    if (ty >= this.height) return TILE.EMPTY;
    return this.tiles[ty * this.width + tx];
  }

  setTile(tx, ty, val) {
    if (tx < 0 || tx >= this.width || ty < 0 || ty >= this.height) return;
    this.tiles[ty * this.width + tx] = val;
  }

  bumpTile(tx, ty) {
    if (tx < 0 || tx >= this.width || ty < 0 || ty >= this.height) return;
    this.bumpOffsets[ty * this.width + tx] = -5;
  }

  triggerCrumble(tx, ty) {
    const idx = ty * this.width + tx;
    if (!this.crumbleTimers.has(idx)) {
      this.crumbleTimers.set(idx, { state: 'shaking', timer: 0.52, tx, ty });
    }
  }

  isSolid(tx, ty, phase) {
    const t = this.getTile(tx, ty);
    if (t === TILE.GROUND || t === TILE.DIRT || t === TILE.BRICK || t === TILE.QUESTION || t === TILE.USED || t === TILE.CRACKED) {
      return true;
    }
    if (t === TILE.SOLAR_BLOCK) return phase === PHASE.SOLAR;
    if (t === TILE.LUNAR_BLOCK) return phase === PHASE.LUNAR;
    if (t === TILE.CRUMBLE) {
      const c = this.crumbleTimers.get(ty * this.width + tx);
      return !c || c.state !== 'gone';
    }
    return false;
  }

  isOneWay(tx, ty) {
    return this.getTile(tx, ty) === TILE.ONE_WAY;
  }

  isHazard(tx, ty) {
    const t = this.getTile(tx, ty);
    return t === TILE.SPIKE || t === TILE.LAVA;
  }

  update(dt, particles) {
    for (let i = 0; i < this.bumpOffsets.length; i++) {
      if (this.bumpOffsets[i] < 0) {
        this.bumpOffsets[i] = Math.min(0, this.bumpOffsets[i] + 38 * dt);
      }
    }

    for (const [idx, c] of this.crumbleTimers.entries()) {
      c.timer -= dt;
      if (c.state === 'shaking' && c.timer <= 0) {
        c.state = 'gone';
        c.timer = 2.6;
        particles.spawnDebris(c.tx * 16 + 8, c.ty * 16 + 8, '#a6876f', '#61493c');
      } else if (c.state === 'gone' && c.timer <= 0) {
        this.crumbleTimers.delete(idx);
        particles.burst(c.tx * 16 + 8, c.ty * 16 + 8, 6, '#f2d9b8', { speedMax: 45, gravity: 0 });
      }
    }
  }
}

// === src/player.js ===
class Player {
  constructor(x, y) {
    this.w = 10;
    this.h = 15;
    this.respawnX = x;
    this.respawnY = y;
    this.reset(x, y);
  }

  reset(x, y) {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.facing = 1;
    this.onGround = false;
    this.wallDir = 0; // -1 left wall, 1 right wall
    this.coyoteTimer = 0;
    this.wallCoyoteTimer = 0;
    this.lastWallDir = 0;
    this.jumpBufferTimer = 0;

    this.canDash = true;
    this.dashTimer = 0;
    this.dashCooldown = 0;
    this.dashDirX = 1;
    this.dashDirY = 0;
    this.afterimageTimer = 0;

    this.groundPounding = false;
    this.poundWindup = 0;

    this.hp = 3;
    this.maxHp = 3;
    this.invulnTimer = 0;
    this.dead = false;

    this.scaleX = 1;
    this.scaleY = 1;
    this.animTimer = 0;
    this.standingPlatform = null;

    // Verlet flowing cape (6 nodes)
    this.cape = [];
    for (let i = 0; i < 6; i++) {
      this.cape.push({ x: x - i * 3, y: y + 6 + i, px: x - i * 3, py: y + 6 + i });
    }
  }

  get cx() {
    return this.x + this.w * 0.5;
  }

  get cy() {
    return this.y + this.h * 0.5;
  }

  setSquash(sx, sy) {
    this.scaleX = sx;
    this.scaleY = sy;
  }

  hurt(game, knockDir = -1) {
    if (this.invulnTimer > 0 || this.dead) return false;
    this.hp -= 1;
    this.invulnTimer = 1.35;
    this.groundPounding = false;
    this.dashTimer = 0;
    this.vx = knockDir * 155;
    this.vy = -215;
    this.setSquash(1.3, 0.7);
    game.sound.playHurt();
    game.addShake(6);
    game.hitstop = 0.06;
    game.combo = 0;
    game.particles.burst(this.cx, this.cy, 14, '#ff5978', { speedMax: 140, glow: true });
    if (this.hp <= 0) {
      this.dead = true;
      game.onPlayerDeath();
    }
    return true;
  }

  update(dt, input, game) {
    if (this.dead) return;

    const { level, phase, sound, particles, atlas } = game;
    const isLunar = phase === PHASE.LUNAR;
    const prevOnGround = this.onGround;

    // Carry from moving platform
    if (this.standingPlatform) {
      this.x += this.standingPlatform.dx;
      this.y += this.standingPlatform.dy;
      this.standingPlatform = null;
    }

    // Recover squash & stretch
    this.scaleX += (1 - this.scaleX) * Math.min(1, dt * 16);
    this.scaleY += (1 - this.scaleY) * Math.min(1, dt * 16);

    if (this.invulnTimer > 0) this.invulnTimer -= dt;
    if (this.dashCooldown > 0) this.dashCooldown -= dt;
    if (this.coyoteTimer > 0) this.coyoteTimer -= dt;
    if (this.wallCoyoteTimer > 0) this.wallCoyoteTimer -= dt;
    if (this.jumpBufferTimer > 0) this.jumpBufferTimer -= dt;

    if (input.jumpPressed) {
      this.jumpBufferTimer = PHYSICS.JUMP_BUFFER;
    }

    const moveX = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    const moveY = (input.down ? 1 : 0) - (input.up ? 1 : 0);
    if (moveX !== 0 && this.dashTimer <= 0) {
      this.facing = moveX;
    }

    // --- GROUND POUND ---
    if (!this.onGround && !this.groundPounding && this.dashTimer <= 0 && input.downPressed && this.wallDir === 0) {
      this.groundPounding = true;
      this.poundWindup = PHYSICS.GROUND_POUND_WINDUP;
      this.vx = 0;
      this.vy = -40;
      this.setSquash(0.72, 1.38);
      particles.burst(this.cx, this.cy, 8, isLunar ? '#7eeeff' : '#ffd06b', { speedMax: 75, gravity: 0, glow: true });
    }

    if (this.groundPounding) {
      if (this.poundWindup > 0) {
        this.poundWindup -= dt;
        this.vy = 0;
      } else {
        this.vy = PHYSICS.GROUND_POUND_SPEED;
        this.vx = 0;
        if (Math.random() < 0.7) {
          particles.burst(this.cx, this.y, 1, isLunar ? '#4ae3ff' : '#ffae38', { speedMax: 25, gravity: -40, lifeMax: 0.18, glow: true });
        }
      }
    }

    // --- DASH ---
    if (input.dashPressed && this.canDash && this.dashCooldown <= 0 && this.dashTimer <= 0) {
      this.groundPounding = false;
      this.canDash = false;
      this.dashTimer = PHYSICS.DASH_TIME;
      this.dashCooldown = PHYSICS.DASH_COOLDOWN;
      let dx = moveX;
      let dy = moveY;
      if (dx === 0 && dy === 0) dx = this.facing;
      const len = Math.hypot(dx, dy) || 1;
      this.dashDirX = dx / len;
      this.dashDirY = dy / len;
      this.vx = this.dashDirX * PHYSICS.DASH_SPEED;
      this.vy = this.dashDirY * PHYSICS.DASH_SPEED;
      this.setSquash(Math.abs(dx) >= Math.abs(dy) ? 1.38 : 0.74, Math.abs(dx) >= Math.abs(dy) ? 0.72 : 1.35);
      sound.playDash(isLunar);
      game.addShake(3.2);
      game.hitstop = 0.025;
      particles.burst(this.cx, this.cy, 12, isLunar ? '#5ce6ff' : '#ffba42', {
        speedMax: 115,
        gravity: 0,
        glow: true,
      });
    }

    if (this.dashTimer > 0) {
      this.dashTimer -= dt;
      this.vx = this.dashDirX * PHYSICS.DASH_SPEED;
      this.vy = this.dashDirY * PHYSICS.DASH_SPEED;
      this.afterimageTimer -= dt;
      if (this.afterimageTimer <= 0) {
        this.afterimageTimer = 0.026;
        const spr = this.getSprite(atlas, phase);
        particles.spawnAfterimage(this.x - 3, this.y - 3, spr, isLunar ? '#4ae3ff' : '#ffae38');
      }
      if (this.dashTimer <= 0) {
        this.vx *= 0.56;
        this.vy *= 0.45;
      }
    } else if (!this.groundPounding) {
      // --- HORIZONTAL MOVEMENT ---
      const accel = this.onGround ? PHYSICS.GROUND_ACCEL : PHYSICS.AIR_ACCEL;
      const decel = this.onGround ? PHYSICS.GROUND_DECEL : PHYSICS.AIR_DECEL;
      if (moveX !== 0) {
        const target = moveX * PHYSICS.RUN_SPEED;
        if (this.vx < target) this.vx = Math.min(target, this.vx + accel * dt);
        else if (this.vx > target) this.vx = Math.max(target, this.vx - accel * dt);
      } else {
        if (this.vx > 0) this.vx = Math.max(0, this.vx - decel * dt);
        else if (this.vx < 0) this.vx = Math.min(0, this.vx + decel * dt);
      }

      // --- GRAVITY ---
      const g = PHYSICS.GRAVITY * (isLunar ? PHYSICS.LUNAR_GRAVITY_MULT : 1.0);
      this.vy += g * dt;

      // Wall slide cap
      if (!this.onGround && this.wallDir !== 0 && this.vy > 0 && moveX === this.wallDir) {
        if (this.vy > PHYSICS.WALL_SLIDE_MAX) this.vy = PHYSICS.WALL_SLIDE_MAX;
        if (Math.random() < 0.35) {
          particles.burst(
            this.wallDir > 0 ? this.x + this.w : this.x,
            this.y + 4,
            1,
            '#dce4f7',
            { speedMax: 24, gravity: 40, lifeMax: 0.25 }
          );
        }
      } else if (this.vy > PHYSICS.MAX_FALL) {
        this.vy = PHYSICS.MAX_FALL;
      }

      // --- JUMPING (GROUND / COYOTE / WALL) ---
      if (this.jumpBufferTimer > 0) {
        if (this.coyoteTimer > 0) {
          this.vy = PHYSICS.JUMP_VEL;
          this.onGround = false;
          this.coyoteTimer = 0;
          this.jumpBufferTimer = 0;
          this.setSquash(0.76, 1.32);
          sound.playJump(isLunar);
          particles.burst(this.cx, this.y + this.h, 7, '#e2e8f5', {
            speedMin: 18,
            speedMax: 70,
            angleOffset: -Math.PI * 0.5,
            spread: Math.PI * 0.85,
            gravity: 160,
          });
        } else if (this.wallCoyoteTimer > 0 && this.lastWallDir !== 0) {
          this.vy = PHYSICS.WALL_JUMP_Y;
          this.vx = -this.lastWallDir * PHYSICS.WALL_JUMP_X;
          this.facing = -this.lastWallDir;
          this.wallCoyoteTimer = 0;
          this.jumpBufferTimer = 0;
          this.setSquash(0.75, 1.32);
          sound.playWallJump();
          particles.burst(
            this.lastWallDir > 0 ? this.x + this.w : this.x,
            this.cy,
            8,
            isLunar ? '#7eeeff' : '#ffd06b',
            { speedMax: 90, gravity: 120, glow: true }
          );
        }
      }

      // Variable jump height cut
      if (!input.jump && this.vy < -60) {
        this.vy *= Math.pow(PHYSICS.JUMP_CUT_MULT, dt * 18);
      }
    }

    // --- MOVE & COLLIDE X ---
    this.x += this.vx * dt;
    this.wallDir = 0;
    this._resolveX(level, phase);

    // --- MOVE & COLLIDE Y ---
    const prevBottom = this.y + this.h;
    this.y += this.vy * dt;
    this.onGround = false;
    this._resolveY(level, phase, prevBottom, game);

    // Moving platforms collision (one-way top)
    if (this.vy >= 0) {
      for (const p of game.platforms) {

          this.vy = 0;

          particles.burst(this.cx, this.y + this.h, 5, '#dce4f5', {

            speedMax: 55,

    this._checkHazards(level, game);

  _finishGroundPound(game) {

    const rightTx = Math.floor((this.x + this.w + 4) / TILE_SIZE);
    for (let tx = leftTx; tx <= rightTx; tx++) {
      const t = game.level.getTile(tx, footTy);
      if (t === TILE.CRACKED || t === TILE.BRICK) {
        game.level.setTile(tx, footTy, TILE.EMPTY);

  _resolveX(level, phase) {
    const topTy = Math.floor(this.y / TILE_SIZE);
    const botTy = Math.floor((this.y + this.h - 0.01) / TILE_SIZE);

    if (this.vx > 0) {
      const rightTx = Math.floor((this.x + this.w) / TILE_SIZE);
      for (let ty = topTy; ty <= botTy; ty++) {
        if (level.isSolid(rightTx, ty, phase)) {
          this.x = rightTx * TILE_SIZE - this.w - 0.01;
          this.vx = 0;
          this.wallDir = 1;
          break;
        }
      }
    } else if (this.vx < 0) {
      const leftTx = Math.floor(this.x / TILE_SIZE);
      for (let ty = topTy; ty <= botTy; ty++) {
        if (level.isSolid(leftTx, ty, phase)) {
          this.x = (leftTx + 1) * TILE_SIZE + 0.01;
          this.vx = 0;
          this.wallDir = -1;
          break;
        }
      }
    }
    if (this.x < 0) {
      this.x = 0;
      this.vx = 0;
    }
    if (this.x + this.w > level.widthPx) {
      this.x = level.widthPx - this.w;
      this.vx = 0;
    }
  }

  _resolveY(level, phase, prevBottom, game) {
    const leftTx = Math.floor(this.x / TILE_SIZE);
    const rightTx = Math.floor((this.x + this.w - 0.01) / TILE_SIZE);

    if (this.vy >= 0) {
      const botTy = Math.floor((this.y + this.h) / TILE_SIZE);
      for (let tx = leftTx; tx <= rightTx; tx++) {
        const solid = level.isSolid(tx, botTy, phase);
        const oneWay = level.isOneWay(tx, botTy) && prevBottom <= botTy * TILE_SIZE + 4;
        if (solid || oneWay) {
          this.y = botTy * TILE_SIZE - this.h;
          this.vy = 0;
          this.onGround = true;
          if (level.getTile(tx, botTy) === TILE.CRUMBLE) {
            level.triggerCrumble(tx, botTy);
          }
          break;
        }
      }
    } else if (this.vy < 0) {
      const topTy = Math.floor(this.y / TILE_SIZE);
      let hitTiles = [];
      for (let tx = leftTx; tx <= rightTx; tx++) {
        if (level.isSolid(tx, topTy, phase)) {
          hitTiles.push(tx);
        }
      }
      if (hitTiles.length > 0) {
        // Corner correction: if only clipping one edge slightly, nudge smoothly around!
        if (hitTiles.length === 1) {
          const htx = hitTiles[0];
          const tileLeft = htx * TILE_SIZE;
          const tileRight = tileLeft + TILE_SIZE;
          if (this.x + this.w - tileLeft <= PHYSICS.CORNER_CORRECT_PX && !level.isSolid(htx - 1, topTy, phase)) {
            this.x = tileLeft - this.w - 0.05;
            return;
          }
          if (tileRight - this.x <= PHYSICS.CORNER_CORRECT_PX && !level.isSolid(htx + 1, topTy, phase)) {
            this.x = tileRight + 0.05;
            return;
          }
        }
        // Ceiling bonk! Trigger ? / Brick blocks
        this.y = (topTy + 1) * TILE_SIZE + 0.01;
        this.vy = 0;
        const centerTx = Math.floor(this.cx / TILE_SIZE);
        const hitTx = hitTiles.includes(centerTx) ? centerTx : hitTiles[0];
        game.onBlockBump(hitTx, topTy);
      }
    }
  }

  _checkHazards(level, game) {
    if (this.y > level.heightPx + 18) {
      this.hp = 0;
      this.dead = true;
      game.sound.playHurt();
      game.onPlayerDeath();
      return;
    }
    const leftTx = Math.floor((this.x + 2) / TILE_SIZE);
    const rightTx = Math.floor((this.x + this.w - 2) / TILE_SIZE);
    const topTy = Math.floor((this.y + 3) / TILE_SIZE);
    const botTy = Math.floor((this.y + this.h - 2) / TILE_SIZE);

    for (let ty = topTy; ty <= botTy; ty++) {
      for (let tx = leftTx; tx <= rightTx; tx++) {
        if (level.isHazard(tx, ty)) {
          this.hurt(game, -this.facing);
          return;
        }
      }
    }
  }

  _updateCape(dt, time) {
    const anchorX = this.cx - this.facing * 2;
    const anchorY = this.y + 7;
    this.cape[0].x = anchorX;
    this.cape[0].y = anchorY;

    const windX = -this.facing * 26 + Math.sin(time * 7) * 14;
    for (let i = 1; i < this.cape.length; i++) {
      const n = this.cape[i];
      const vx = (n.x - n.px) * 0.82;
      const vy = (n.y - n.py) * 0.82;
      n.px = n.x;
      n.py = n.y;
      n.x += vx + windX * dt * dt * 16;
      n.y += vy + 240 * dt * dt;
    }

    // Distance constraints
    const segLen = 2.6;
    for (let iter = 0; iter < 3; iter++) {
      this.cape[0].x = anchorX;
      this.cape[0].y = anchorY;
      for (let i = 1; i < this.cape.length; i++) {
        const a = this.cape[i - 1];
        const b = this.cape[i];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        const diff = (dist - segLen) / dist;
        b.x -= dx * diff;
        b.y -= dy * diff;
      }
    }
  }

  getSprite(atlas, phase) {
    const set = atlas.player[phase];
    const r = this.facing >= 0;
    if (!this.onGround && this.wallDir !== 0) {
      return this.wallDir > 0 ? set.wallR : set.wallL;
    }
    if (!this.onGround) {
      return r ? set.jumpR : set.jumpL;
    }
    if (Math.abs(this.vx) > 15) {
      const frame = Math.floor(this.animTimer) % 2;
      if (frame === 0) return r ? set.run1R : set.run1L;
      return r ? set.run2R : set.run2L;
    }
    return r ? set.idleR : set.idleL;
  }
}

class BaseEnemy {
  constructor(x, y, w, h) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.vx = -36;
    this.vy = 0;
    this.alive = true;
    this.onGround = false;
  }

  get cx() { return this.x + this.w * 0.5; }
  get cy() { return this.y + this.h * 0.5; }

  moveAndCollide(dt, level, phase, turnAtLedge = true) {
    this.vy = Math.min(340, this.vy + PHYSICS.GRAVITY * dt);
    this.x += this.vx * dt;

    const topTy = Math.floor(this.y / TILE_SIZE);
    const botTy = Math.floor((this.y + this.h - 1) / TILE_SIZE);

    if (this.vx > 0) {
      const rtx = Math.floor((this.x + this.w) / TILE_SIZE);
      for (let ty = topTy; ty <= botTy; ty++) {
        if (level.isSolid(rtx, ty, phase)) {
          this.x = rtx * TILE_SIZE - this.w - 0.01;
          this.vx = -Math.abs(this.vx);
          return true; // hit wall
        }
      }
    } else if (this.vx < 0) {
      const ltx = Math.floor(this.x / TILE_SIZE);
      for (let ty = topTy; ty <= botTy; ty++) {
        if (level.isSolid(ltx, ty, phase)) {
          this.x = (ltx + 1) * TILE_SIZE + 0.01;
          this.vx = Math.abs(this.vx);
          return true;
        }
      }
    }

    this.y += this.vy * dt;
    this.onGround = false;
    const leftTx = Math.floor(this.x / TILE_SIZE);
    const rightTx = Math.floor((this.x + this.w - 1) / TILE_SIZE);
    const footTy = Math.floor((this.y + this.h) / TILE_SIZE);
    for (let tx = leftTx; tx <= rightTx; tx++) {
      if (level.isSolid(tx, footTy, phase)) {
        this.y = footTy * TILE_SIZE - this.h;
        this.vy = 0;
        this.onGround = true;
        break;
      }
    }

    if (turnAtLedge && this.onGround && Math.abs(this.vx) > 0) {
      const aheadTx = Math.floor((this.vx > 0 ? this.x + this.w + 2 : this.x - 2) / TILE_SIZE);
      if (!level.isSolid(aheadTx, footTy, phase)) {
        this.vx = -this.vx;
      }
    }

    if (this.y > level.heightPx + 32) this.alive = false;
    return false;
  }
}
