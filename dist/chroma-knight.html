          player.setSquash(0.76, 1.32);
        }
      } else if (this.kickGrace <= 0) {
        if (player.dashTimer > 0 && this.state === 'walk') {
          this.onStomped(game);
          this.kick(player.facing, game);
        } else {
          player.hurt(game, player.cx < this.cx ? -1 : 1);
        }
      }
    }
  }
}
class WispEnemy {
  constructor(x, y, wispPhase) {
    this.type = 'wisp';
    this.baseX = x;
    this.baseY = y;
    this.x = x;
    this.y = y;
    this.w = 12;
    this.h = 12;
    this.wispPhase = wispPhase;
    this.alive = true;
    this.t = Math.random() * Math.PI * 2;
  }

  get cx() { return this.x + 6; }
  get cy() { return this.y + 6; }

  onStomped(game, fromShockwave = false) {
    this.alive = false;
    game.combo = Math.min(20, game.combo + 1);
    game.comboTimer = 2.8;
    const pts = 150 * Math.min(5, game.combo);
    game.addScore(pts, this.cx, this.y, `+${pts} PHASE!`);
    game.sound.playStomp(game.combo);
    game.particles.burst(this.cx, this.cy, 14, this.wispPhase === PHASE.SOLAR ? '#ffb638' : '#4ae3ff', { speedMax: 130, glow: true });
    if (!fromShockwave) {
      game.hitstop = 0.04;
      game.addShake(3);
    }
  }

  update(dt, player, game) {
    if (!this.alive) return;
    this.t += dt * 2.4;
    this.x = this.baseX + Math.cos(this.t * 0.7) * 28;
    this.y = this.baseY + Math.sin(this.t * 1.4) * 14;

    // Only tangible in matching phase!
    const tangible = game.phase === this.wispPhase;
    if (!tangible) return;

    if (overlaps(this, player)) {
      const stomping = (player.vy > 0 && player.y + player.h - this.y < 10) || player.dashTimer > 0 || player.groundPounding;
      if (stomping) {
        this.onStomped(game);
        if (!player.groundPounding && player.dashTimer <= 0) {
          player.vy = PHYSICS.STOMP_BOUNCE;
          player.canDash = true;
        }
      } else {
        player.hurt(game, player.cx < this.cx ? -1 : 1);
      }
    }
  }
}
class BossProjectile {
  constructor(x, y, vx, vy, phase) {
    this.x = x;
    this.y = y;
    this.w = 8;
    this.h = 8;
    this.vx = vx;
    this.vy = vy;
    this.phase = phase;
    this.life = 4.2;
    this.alive = true;
  }

  update(dt, player, game) {
    if (!this.alive) return;
    this.life -= dt;
    if (this.life <= 0) {
      this.alive = false;
      return;
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Only hurts when matching current world phase — encourages reactive phase-dodging!
    if (this.phase === game.phase && overlaps(this, player)) {
      player.hurt(game, this.vx >= 0 ? 1 : -1);
      this.alive = false;
      game.particles.burst(this.x + 4, this.y + 4, 8, this.phase === PHASE.SOLAR ? '#ffb638' : '#4ae3ff', { speedMax: 90, glow: true });
    }
  }
}
class PrismGolemBoss {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.w = 32;
    this.h = 32;
    this.vx = 0;
    this.vy = 0;
    this.hp = 6;
    this.maxHp = 6;
    this.alive = true;
    this.active = false;
    this.bossPhase = PHASE.SOLAR;
    this.hurtTimer = 0;
    this.stateTimer = 1.6;
    this.state = 'idle'; // 'idle' | 'leap' | 'orbs'
    this.onGround = false;
    this.homeX = x;
  }

  get cx() { return this.x + this.w * 0.5; }
  get cy() { return this.y + this.h * 0.5; }

  takeDamage(game, dmg = 1) {
    if (this.hurtTimer > 0 || !this.alive) return;
    this.hp -= dmg;
    this.hurtTimer = 0.75;
    this.bossPhase = this.bossPhase === PHASE.SOLAR ? PHASE.LUNAR : PHASE.SOLAR;
    game.sound.playBossHit();
    game.hitstop = 0.08;
    game.addShake(9);
    const col = this.bossPhase === PHASE.SOLAR ? '#ffba42' : '#4ae3ff';
    game.particles.burst(this.cx, this.cy, 24, col, { speedMax: 170, glow: true });
    game.particles.spawnRipple(this.cx, this.cy, col, 140);
    game.addScore(500, this.cx, this.y - 6, 'CRITICAL!');

    if (this.hp <= 0) {
      this.alive = false;
      game.addScore(2500, this.cx, this.y, 'BOSS DEFEATED!');
      game.sound.playVictory();
      game.addShake(14);
      game.particles.burst(this.cx, this.cy, 48, '#fff3a8', { speedMax: 220, lifeMax: 1.1, glow: true });
      game.particles.burst(this.cx, this.cy, 36, '#4ae3ff', { speedMax: 190, lifeMax: 1.0, glow: true });
      game.sound.setBgmMode(game.phase);
    }
  }

  update(dt, player, game) {
    if (!this.alive) return;

    if (!this.active) {
      if (Math.abs(player.cx - this.cx) < 195) {
        this.active = true;
        game.sound.setBgmMode('boss');
        game.particles.spawnText(this.cx, this.y - 16, 'PRISM GOLEM AWAKENS!', '#ff7582');
      }
      return;
    }

    if (this.hurtTimer > 0) this.hurtTimer -= dt;
    this.stateTimer -= dt;

    // Gravity & ground collide
    this.vy = Math.min(360, this.vy + PHYSICS.GRAVITY * dt);
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Keep inside arena bounds
    const minX = this.homeX - 96;
    const maxX = this.homeX + 86;
    if (this.x < minX) { this.x = minX; this.vx = Math.abs(this.vx); }
    if (this.x > maxX) { this.x = maxX; this.vx = -Math.abs(this.vx); }

    const footTy = Math.floor((this.y + this.h) / TILE_SIZE);
    const midTx = Math.floor(this.cx / TILE_SIZE);
    const wasAir = !this.onGround;
    if (game.level.isSolid(midTx, footTy, game.phase)) {
      this.y = footTy * TILE_SIZE - this.h;
      this.vy = 0;
      this.onGround = true;
      this.vx *= 0.82;
      if (wasAir && this.state === 'leap') {
        game.sound.playGroundPound();
        game.addShake(7);
        const col = this.bossPhase === PHASE.SOLAR ? '#ffba42' : '#4ae3ff';
        game.particles.spawnRipple(this.cx, this.y + this.h, col, 95);
        // Fire 2 ground shockwave orbs
        game.projectiles.push(new BossProjectile(this.cx - 10, this.y + this.h - 10, -115, 0, this.bossPhase));
        game.projectiles.push(new BossProjectile(this.cx + 10, this.y + this.h - 10, 115, 0, this.bossPhase));
      }
    } else {
      this.onGround = false;
    }

    // Boss AI pattern
    if (this.stateTimer <= 0 && this.onGround) {
      if (this.state === 'idle' || this.state === 'orbs') {
        this.state = 'leap';
        const dir = player.cx < this.cx ? -1 : 1;
        this.vx = dir * 105;
        this.vy = -295;
        this.onGround = false;
        this.stateTimer = 2.0;
      } else {
        this.state = 'orbs';
        this.stateTimer = 1.85;
        // Fire 3-orb radial fan
        const dx = player.cx - this.cx;
        const dy = player.cy - this.cy;
        const baseAngle = Math.atan2(dy, dx);
        for (const offset of [-0.32, 0, 0.32]) {
          const a = baseAngle + offset;
          game.projectiles.push(
            new BossProjectile(this.cx - 4, this.cy - 4, Math.cos(a) * 118, Math.sin(a) * 118, this.bossPhase)
          );
        }
        game.sound.playPhaseShift(this.bossPhase === PHASE.LUNAR);
      }
    }

    // Player collision with Boss
    if (overlaps(this, player)) {
      const stompingCrown = (player.vy > 0 && player.y + player.h - this.y < 14) || player.groundPounding;
      if (stompingCrown && this.hurtTimer <= 0) {
        const dmg = player.groundPounding ? 2 : 1;
        player.groundPounding = false;
        player.vy = PHYSICS.STOMP_HIGH_BOUNCE;
        player.vx = (player.cx < this.cx ? -1 : 1) * 120;
        player.canDash = true;
        this.takeDamage(game, dmg);
      } else if (this.hurtTimer <= 0) {
        player.hurt(game, player.cx < this.cx ? -1 : 1);
      }
    }
  }
}

// === src/renderer.js ===
class Renderer {
  constructor(canvas, atlas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    this.atlas = atlas;

    // Pre-generate starfield for Lunar sky
    this.stars = [];
    for (let i = 0; i < 64; i++) {
      this.stars.push({
        x: Math.random() * GAME_WIDTH,
        y: Math.random() * (GAME_HEIGHT * 0.65),
        size: Math.random() < 0.25 ? 2 : 1,
        speed: 1.5 + Math.random() * 3,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  render(game) {
    const ctx = this.ctx;
    const { phase, time, level, player, particles, camera } = game;
    const pal = PALETTES[phase];

    // 1. Sky & Parallax Background
    this._drawBackground(ctx, pal, phase, time, camera.x);

    // World Space Transform (with camera + micro-shake)
    const camX = Math.round(camera.x + camera.shakeX);
    const camY = Math.round(camera.y + camera.shakeY);

    ctx.save();
    ctx.translate(-camX, -camY);

    // 2. Tilemap
    if (level) {
      this._drawTiles(ctx, level, phase, time, camX);
      this._drawInteractiveGrass(ctx, particles.grass, phase);
    }

    // 3. Entities (Platforms, Springs, Checkpoints, Coins, Crystals, Enemies, Boss)
    if (level) {
      this._drawPlatforms(ctx, game.platforms, phase);
      this._drawSprings(ctx, game.springs);
      this._drawCheckpoints(ctx, game.checkpoints, time, phase);
      this._drawPickups(ctx, game.coinsList, game.hearts, game.dashCrystals, time);
      this._drawEnemies(ctx, game.enemies, phase, time);
      if (game.boss && game.boss.alive) {
        this._drawBoss(ctx, game.boss, time);
      }
      this._drawProjectiles(ctx, game.projectiles, phase, time);
    }

    // 4. Player Afterimages + Cape + Player Sprite
    if (player && !player.dead && game.state !== STATE.TITLE) {
      this._drawAfterimages(ctx, particles.afterimages);
      this._drawCape(ctx, player, pal);
      this._drawPlayer(ctx, player, phase, time);
    }

    // 5. Particles, Ripples, Floating Texts
    this._drawAmbient(ctx, particles.ambient, phase, time);
    this._drawParticles(ctx, particles.particles);
    this._drawRipples(ctx, particles.ripples);
    this._drawTexts(ctx, particles.texts);

    // 6. Dynamic 2D Additive Lighting Pass
    if (level) {
      this._drawDynamicLights(ctx, game, phase, time);
    }

    ctx.restore();

    // 7. Subtle Phase Vignette / Ambient Tint
    ctx.fillStyle = pal.ambient;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    // 8. HUD & Overlays
    if (game.state === STATE.TITLE) {
      this._drawTitleScreen(ctx, game, time);
    } else {
      this._drawHUD(ctx, game, time);
      if (game.showDebug) this._drawDebug(ctx, game);
      if (game.state === STATE.PAUSED) this._drawPauseOverlay(ctx);
      else if (game.state === STATE.STAGE_CLEAR) this._drawStageClear(ctx, game);
      else if (game.state === STATE.VICTORY) this._drawVictory(ctx, game, time);
      else if (game.state === STATE.GAME_OVER) this._drawGameOver(ctx, game);
    }
  }

  _drawBackground(ctx, pal, phase, time, camX) {
    const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
    grad.addColorStop(0, pal.skyTop);
    grad.addColorStop(0.55, pal.skyMid);
    grad.addColorStop(1, pal.skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    // Stars (brighter in lunar, faint high-altitude stars in solar)
    const starAlpha = phase === PHASE.LUNAR ? 0.92 : 0.25;
    for (const s of this.stars) {
      const tw = 0.4 + 0.6 * Math.sin(time * s.speed + s.phase);
      ctx.fillStyle = `rgba(235, 248, 255, ${(tw * starAlpha).toFixed(2)})`;
      ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
    }

    // Sun / Crescent Moon
    const orbX = 365 - ((camX * 0.03) % 80);
    const orbY = 58;
    const glow = ctx.createRadialGradient(orbX, orbY, 4, orbX, orbY, 54);
    glow.addColorStop(0, pal.sunGlow);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(orbX - 54, orbY - 54, 108, 108);

    ctx.fillStyle = pal.sunColor;
    ctx.beginPath();
    ctx.arc(orbX, orbY, 16, 0, Math.PI * 2);
    ctx.fill();
    if (phase === PHASE.LUNAR) {
      ctx.fillStyle = pal.skyTop;
      ctx.beginPath();
      ctx.arc(orbX + 6, orbY - 3, 13, 0, Math.PI * 2);
      ctx.fill();
    }

    // Parallax Clouds
    ctx.fillStyle = phase === PHASE.SOLAR ? 'rgba(255, 212, 168, 0.16)' : 'rgba(120, 210, 255, 0.11)';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 110 - camX * 0.08 - time * 6) % (GAME_WIDTH + 120) + GAME_WIDTH + 120) % (GAME_WIDTH + 120) - 60;
      const cy = 34 + (i % 3) * 26;
      ctx.fillRect(Math.floor(cx), cy, 46, 8);
      ctx.fillRect(Math.floor(cx) + 10, cy - 5, 24, 5);
    }

    // Far Mountains
    this._drawMountainLayer(ctx, camX * 0.14, 168, 52, 72, pal.mountainFar);
    // Mid Mountains + Ruin silhouettes
    this._drawMountainLayer(ctx, camX * 0.3, 196, 36, 54, pal.mountainMid);

    // Distant Ruins Arches
    ctx.fillStyle = pal.ruinsFar;
    const archSpacing = 96;
    const startArch = Math.floor((camX * 0.42) / archSpacing) - 1;
    for (let i = startArch; i < startArch + 7; i++) {
      const ax = Math.floor(i * archSpacing - camX * 0.42);
      const h = 36 + ((Math.abs(i * 17) % 3) * 14);
      ctx.fillRect(ax, GAME_HEIGHT - h - 22, 10, h + 22);
      ctx.fillRect(ax + 24, GAME_HEIGHT - h - 22, 10, h + 22);
      ctx.fillRect(ax - 2, GAME_HEIGHT - h - 26, 38, 6);
    }
  }

  _drawMountainLayer(ctx, offset, baseY, amp, step, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, GAME_HEIGHT);
    const startIdx = Math.floor(offset / step) - 1;
    for (let i = startIdx; i <= startIdx + Math.ceil(GAME_WIDTH / step) + 2; i++) {
      const x = i * step - offset;
      const h = Math.abs(Math.sin(i * 1.7 + 0.5)) * amp;
      ctx.lineTo(x, baseY - h);
    }
    ctx.lineTo(GAME_WIDTH, GAME_HEIGHT);
    ctx.closePath();
    ctx.fill();
  }

  _drawTiles(ctx, level, phase, time, camX) {
    const startTx = Math.max(0, Math.floor(camX / TILE_SIZE) - 1);
    const endTx = Math.min(level.width - 1, Math.ceil((camX + GAME_WIDTH) / TILE_SIZE) + 1);
    const t = this.atlas.tiles;
    const isLunar = phase === PHASE.LUNAR;
    const qTile = Math.floor(time * 4) % 2 === 0 ? t.question : t.questionGlow;

    for (let ty = 0; ty < level.height; ty++) {
      for (let tx = startTx; tx <= endTx; tx++) {
        const idx = ty * level.width + tx;
        const tile = level.tiles[idx];
        if (tile === TILE.EMPTY) continue;

        const px = tx * TILE_SIZE;
        let py = ty * TILE_SIZE + level.bumpOffsets[idx];

        switch (tile) {
          case TILE.GROUND:
            ctx.drawImage(isLunar ? t.groundLunar : t.groundSolar, px, py);
            break;
          case TILE.DIRT:
            ctx.drawImage(isLunar ? t.dirtLunar : t.dirtSolar, px, py);
            break;
          case TILE.BRICK:
            ctx.drawImage(t.brick, px, py);
            break;
          case TILE.QUESTION:
            ctx.drawImage(qTile, px, py);
            break;
          case TILE.USED:
            ctx.drawImage(t.used, px, py);
            break;
          case TILE.CRACKED:
            ctx.drawImage(t.cracked, px, py);
            break;
          case TILE.ONE_WAY:
            ctx.drawImage(t.oneWay, px, py);
            break;
          case TILE.SPIKE:
            ctx.drawImage(t.spike, px, py);
            break;
          case TILE.PILLAR:
            ctx.drawImage(t.pillar, px, py);
            break;
          case TILE.SOLAR_BLOCK:
            ctx.drawImage(phase === PHASE.SOLAR ? t.solarSolid : t.solarGhost, px, py);
            break;
          case TILE.LUNAR_BLOCK:
            ctx.drawImage(phase === PHASE.LUNAR ? t.lunarSolid : t.lunarGhost, px, py);
            break;
          case TILE.CRUMBLE: {
            const c = level.crumbleTimers.get(idx);
            if (!c) {
              ctx.drawImage(t.crumble, px, py);
            } else if (c.state === 'shaking') {
              const jitter = (Math.random() - 0.5) * 3;
              ctx.drawImage(t.crumble, px + jitter, py);
            } else {
              // Faint ghost outline while regenerating
              ctx.strokeStyle = 'rgba(214, 188, 165, 0.25)';
              ctx.strokeRect(px + 2, py + 2, 12, 12);
            }
            break;
          }
          case TILE.WATER: {
            const wave = Math.sin(time * 4 + tx * 0.9) * 1.5;
            ctx.fillStyle = isLunar ? 'rgba(42, 168, 224, 0.68)' : 'rgba(54, 180, 210, 0.62)';
            ctx.fillRect(px, py + 3 + wave, 16, 13 - wave);
            ctx.fillStyle = 'rgba(210, 250, 255, 0.72)';
            ctx.fillRect(px, py + 3 + wave, 16, 2);
            break;
          }
          case TILE.LAVA: {
            const wave = Math.sin(time * 5 + tx * 1.1) * 1.6;
            ctx.fillStyle = '#d9342b';
            ctx.fillRect(px, py + 3 + wave, 16, 13 - wave);
            ctx.fillStyle = '#ff9838';
            ctx.fillRect(px, py + 3 + wave, 16, 3);
            ctx.fillStyle = '#fff099';
            ctx.fillRect(px + ((tx * 5 + Math.floor(time * 12)) % 12), py + 4 + wave, 4, 1);
            break;
          }
          case TILE.GOAL_GATE: {
            this._drawGoalPortal(ctx, px, py, time);
            break;
          }
        }
      }
    }
  }

  _drawGoalPortal(ctx, px, py, time) {
    const cx = px + 8;
    const cy = py - 4;
    // Stone arch
    ctx.fillStyle = '#333652';
    ctx.fillRect(px - 2, py - 20, 20, 36);
    ctx.fillStyle = '#5c628a';
    ctx.fillRect(px, py - 18, 16, 34);
    // Swirling chroma vortex
    const pulse = 1 + Math.sin(time * 6) * 0.12;
    ctx.fillStyle = '#1b1433';
    ctx.fillRect(px + 2, py - 15, 12, 31);
    ctx.fillStyle = '#ffbe44';
    ctx.fillRect(cx - 4 * pulse, cy - 8 * pulse, 8 * pulse, 20 * pulse);
    ctx.fillStyle = '#4ae3ff';
    ctx.fillRect(cx - 2.5 * pulse, cy - 5 * pulse, 5 * pulse, 14 * pulse);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 1, cy - 2, 2, 8);
  }

  _drawInteractiveGrass(ctx, grass, phase) {
    const color = phase === PHASE.LUNAR ? '#6ef7e8' : '#74e86b';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < grass.length; i++) {
      const g = grass[i];
      const tipX = g.x + Math.sin(g.angle) * g.h;
      const tipY = g.y - Math.cos(g.angle) * g.h;
      ctx.moveTo(g.x, g.y);
      ctx.lineTo(tipX, tipY);
    }
    ctx.stroke();
  }

  _drawPlatforms(ctx, platforms, phase) {
    const accent = phase === PHASE.LUNAR ? '#4ae3ff' : '#ffba42';
    for (const p of platforms) {
      ctx.fillStyle = '#24273d';
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.w, p.h);
      ctx.fillStyle = '#5d658c';
      ctx.fillRect(Math.round(p.x) + 1, Math.round(p.y) + 1, p.w - 2, p.h - 2);
      ctx.fillStyle = accent;
      ctx.fillRect(Math.round(p.x) + 2, Math.round(p.y) + 1, p.w - 4, 2);
    }
  }

  _drawSprings(ctx, springs) {
    for (const s of springs) {
      const comp = s.compress * 5;
      // Base
      ctx.fillStyle = '#2c2f45';
      ctx.fillRect(s.x + 1, s.y + 7, 14, 3);
      // Coil
      ctx.fillStyle = '#9aa4c2';
      ctx.fillRect(s.x + 5, s.y + 3 + comp, 6, 4 - comp * 0.5);
      // Top pad
      ctx.fillStyle = '#ff4b5c';
      ctx.fillRect(s.x + 1, s.y + comp, 14, 4);
      ctx.fillStyle = '#ffd561';
      ctx.fillRect(s.x + 2, s.y + comp, 12, 1);
    }
  }

  _drawCheckpoints(ctx, checkpoints, time, phase) {
    for (const cp of checkpoints) {
      // Pole
      ctx.fillStyle = '#363b54';
      ctx.fillRect(cp.x + 7, cp.y + 6, 2, 18);
      ctx.fillStyle = '#5c638a';
      ctx.fillRect(cp.x + 4, cp.y + 21, 8, 3);
      // Lantern housing
      ctx.fillStyle = '#24273b';
      ctx.fillRect(cp.x + 4, cp.y + 2, 8, 8);
      if (cp.active) {
        const flicker = Math.sin(time * 14) > 0 ? '#fff4a3' : '#ffba42';
        ctx.fillStyle = phase === PHASE.LUNAR ? '#6ef3ff' : flicker;
        ctx.fillRect(cp.x + 5, cp.y + 3, 6, 6);
      } else {
        ctx.fillStyle = '#474c66';
        ctx.fillRect(cp.x + 5, cp.y + 3, 6, 6);
      }
    }
  }

  _drawPickups(ctx, coins, hearts, crystals, time) {
    for (const c of coins) {
      if (c.collected) continue;
      const spin = Math.abs(Math.cos(time * 5 + c.phase));
      const w = Math.max(2, Math.round(10 * spin));
      ctx.drawImage(this.atlas.items.coin, Math.round(c.x + (10 - w) * 0.5), Math.round(c.y), w, 10);
    }
    for (const h of hearts) {
      if (h.collected) continue;
      ctx.drawImage(this.atlas.items.heart, Math.round(h.x), Math.round(h.y));
    }
    for (const d of crystals) {
      if (d.cooldown > 0) {
        ctx.strokeStyle = 'rgba(74, 247, 200, 0.32)';
        ctx.strokeRect(Math.round(d.x + 2), Math.round(d.y + 2), 8, 8);
      } else {
        ctx.drawImage(this.atlas.items.dashCrystal, Math.round(d.x), Math.round(d.y));
      }
    }
  }

  _drawEnemies(ctx, enemies, phase, time) {
    const eAtlas = this.atlas.enemies;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (e.type === 'slime') {
        const spr = Math.floor(time * 6) % 2 === 0 ? eAtlas.slime1 : eAtlas.slime2;
        ctx.drawImage(spr, Math.round(e.x - 1), Math.round(e.y - 2));
      } else if (e.type === 'beetle') {
        if (e.state === 'walk') {
          ctx.drawImage(e.vx >= 0 ? eAtlas.beetleR : eAtlas.beetleL, Math.round(e.x - 1), Math.round(e.y - 1));
        } else {
          ctx.drawImage(eAtlas.shell, Math.round(e.x - 1), Math.round(e.y - 2));
        }
      } else if (e.type === 'wisp') {
        const tangible = e.wispPhase === phase;
        ctx.save();
        ctx.globalAlpha = tangible ? 1 : 0.28;
        ctx.drawImage(e.wispPhase === PHASE.SOLAR ? eAtlas.wispSolar : eAtlas.wispLunar, Math.round(e.x - 2), Math.round(e.y));
        ctx.restore();
      }
    }
  }

  _drawBoss(ctx, boss, time) {
    const isSolar = boss.bossPhase === PHASE.SOLAR;
    const main = isSolar ? '#ff9d2e' : '#32c8ff';
    const core = isSolar ? '#fff4a3' : '#d8fcff';
    const dark = isSolar ? '#592014' : '#122854';

    const bx = Math.round(boss.x);
    const by = Math.round(boss.y);
    const flash = boss.hurtTimer > 0 && Math.floor(time * 24) % 2 === 0;

    // Outer armor body
    ctx.fillStyle = flash ? '#ffffff' : dark;
    ctx.fillRect(bx, by + 4, 32, 28);
    ctx.fillStyle = flash ? '#ffffff' : '#3a3f63';
    ctx.fillRect(bx + 2, by + 6, 28, 24);

    // Glowing Phase Crown (weak spot on top!)
    ctx.fillStyle = main;
    ctx.fillRect(bx + 8, by - 2, 16, 8);
    ctx.fillStyle = core;
    ctx.fillRect(bx + 12, by, 8, 4);

    // Glowing eyes & core
    ctx.fillStyle = main;
    ctx.fillRect(bx + 6, by + 12, 6, 5);
    ctx.fillRect(bx + 20, by + 12, 6, 5);
    ctx.fillStyle = core;
    ctx.fillRect(bx + 8, by + 13, 2, 3);
    ctx.fillRect(bx + 22, by + 13, 2, 3);

    // Chest Prism Core
    const pulse = 2 + Math.sin(time * 8) * 1.5;
    ctx.fillStyle = main;
    ctx.fillRect(bx + 11, by + 20, 10, 6);
    ctx.fillStyle = core;
    ctx.fillRect(bx + 14, by + 21, 4, Math.max(2, pulse));
  }

  _drawProjectiles(ctx, projectiles, phase, time) {
    for (const p of projectiles) {
      if (!p.alive) continue;
      const tangible = p.phase === phase;
      const col = p.phase === PHASE.SOLAR ? '#ffae38' : '#4ae3ff';
      ctx.save();
      ctx.globalAlpha = tangible ? 1 : 0.25;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x + 4, p.y + 4, 4.5 + Math.sin(time * 16) * 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(p.x + 3), Math.round(p.y + 3), 2, 2);
      ctx.restore();
    }
  }

  _drawAfterimages(ctx, afterimages) {
    for (const a of afterimages) {
      ctx.save();
      ctx.globalAlpha = (a.life / a.maxLife) * 0.45;
      ctx.drawImage(a.sprite, Math.round(a.x), Math.round(a.y));
      ctx.restore();
    }
  }

  _drawCape(ctx, player, pal) {
    const pts = player.cape;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i];
      const b = pts[i + 1];
      ctx.strokeStyle = i >= pts.length - 2 ? pal.capeTip : pal.cape;
      ctx.lineWidth = Math.max(2, 5 - i * 0.6);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  _drawPlayer(ctx, player, phase, time) {
    if (player.invulnTimer > 0 && Math.floor(time * 20) % 2 === 0) return;
    const spr = player.getSprite(this.atlas, phase);
    ctx.save();
    ctx.translate(Math.round(player.x + player.w * 0.5), Math.round(player.y + player.h));
    ctx.scale(player.scaleX, player.scaleY);
    ctx.drawImage(spr, -8, -18);
    ctx.restore();
  }

  _drawAmbient(ctx, ambient, phase, time) {
    const col = phase === PHASE.LUNAR ? '#80f4ff' : '#ffd573';
    for (const a of ambient) {
      const alpha = 0.28 + 0.45 * Math.sin(time * 3 + a.phase);
      ctx.fillStyle = col;
      ctx.globalAlpha = Math.max(0.08, alpha);
      ctx.fillRect(Math.round(a.x), Math.round(a.y), a.size, a.size);
    }
    ctx.globalAlpha = 1;
  }

  _drawParticles(ctx, list) {
    for (const p of list) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x - p.size * 0.5), Math.round(p.y - p.size * 0.5), p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  _drawRipples(ctx, ripples) {
    for (const r of ripples) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, (r.life / r.maxLife) * 0.72);
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  _drawTexts(ctx, texts) {
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'center';
    for (const t of texts) {
      ctx.globalAlpha = Math.min(1, (t.life / t.maxLife) * 1.4);
      ctx.fillStyle = '#0d0c18';
      ctx.fillText(t.text, Math.round(t.x) + 1, Math.round(t.y) + 1);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, Math.round(t.x), Math.round(t.y));
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  _drawDynamicLights(ctx, game, phase, time) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    const drawGlow = (x, y, radius, rgba) => {
      const g = ctx.createRadialGradient(x, y, 1, x, y, radius);
      g.addColorStop(0, rgba);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    };

    // Player aura
    if (game.player && !game.player.dead && game.state !== STATE.TITLE) {
      drawGlow(
        game.player.cx,
        game.player.cy,
        game.player.canDash ? 34 : 20,
        phase === PHASE.LUNAR ? 'rgba(64, 224, 255, 0.22)' : 'rgba(255, 190, 74, 0.2)'
      );
    }

    // Active checkpoints
    for (const cp of game.checkpoints) {
      if (cp.active) {
        drawGlow(cp.x + 8, cp.y + 6, 36 + Math.sin(time * 8) * 3, 'rgba(255, 210, 96, 0.28)');
      }
    }

    // Dash crystals
    for (const d of game.dashCrystals) {
      if (d.cooldown <= 0) {
        drawGlow(d.x + 6, d.y + 6, 20, 'rgba(74, 247, 200, 0.25)');
      }
    }

    // Goal portal glow
    if (game.level) {
      drawGlow(game.level.goal.x + 8, game.level.goal.y - 4, 48, 'rgba(180, 220, 255, 0.26)');
    }

    // Boss glow
    if (game.boss && game.boss.alive) {
      const col = game.boss.bossPhase === PHASE.SOLAR ? 'rgba(255, 168, 52, 0.3)' : 'rgba(66, 216, 255, 0.3)';
      drawGlow(game.boss.cx, game.boss.cy, 52, col);
    }

    ctx.restore();
  }

  _drawHUD(ctx, game, time) {
    // Top translucent bar
    ctx.fillStyle = 'rgba(8, 10, 20, 0.56)';
    ctx.fillRect(0, 0, GAME_WIDTH, 22);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.fillRect(0, 22, GAME_WIDTH, 1);

    // Hearts
    for (let i = 0; i < game.player.maxHp; i++) {
      ctx.globalAlpha = i < game.player.hp ? 1 : 0.22;
      ctx.drawImage(this.atlas.items.heart, 8 + i * 12, 6);
    }
    ctx.globalAlpha = 1;

    // Phase Pill
    const isLunar = game.phase === PHASE.LUNAR;
    ctx.fillStyle = isLunar ? 'rgba(56, 212, 255, 0.22)' : 'rgba(255, 178, 56, 0.24)';
    ctx.fillRect(52, 5, 58, 12);
    ctx.strokeStyle = isLunar ? '#4ae3ff' : '#ffbe44';
    ctx.lineWidth = 1;
    ctx.strokeRect(52.5, 5.5, 57, 11);
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = isLunar ? '#8ff4ff' : '#ffe184';
    ctx.fillText(isLunar ? 'LUNAR 星月' : 'SOLAR 熾陽', 56, 14);

    // Dash Ready indicator
    ctx.fillStyle = game.player.canDash ? '#4af7c8' : '#4a5068';
    ctx.fillRect(116, 8, 6, 6);
    ctx.fillStyle = '#c8d2eb';
    ctx.fillText('DASH', 125, 14);

    // Stage Name
    ctx.fillStyle = '#dce4fa';
    ctx.textAlign = 'center';
    ctx.fillText(game.level.name, GAME_WIDTH * 0.5, 14);

    // Coins & Score & Timer
    ctx.textAlign = 'right';
    ctx.drawImage(this.atlas.items.coin, GAME_WIDTH - 134, 6, 9, 9);
    ctx.fillStyle = '#ffe169';
    ctx.fillText(`${game.coins}`, GAME_WIDTH - 108, 14);

    ctx.fillStyle = '#ffffff';
    ctx.fillText(`SCORE ${String(game.score).padStart(6, '0')}`, GAME_WIDTH - 42, 14);

    ctx.fillStyle = '#9db0d8';
    ctx.fillText(`${game.stageTime.toFixed(1)}s`, GAME_WIDTH - 6, 14);
    ctx.textAlign = 'left';

    // Combo Badge
    if (game.combo > 1 && game.comboTimer > 0) {
      ctx.fillStyle = '#ffdf5c';
      ctx.font = 'bold 10px monospace';
      ctx.fillText(`${game.combo}x COMBO!`, 8, 36);
    }

    // Stage Hint (first 7 seconds)
    if (game.stageTime < 7.5 && game.level.hint) {
      const alpha = game.stageTime > 6 ? (7.5 - game.stageTime) / 1.5 : 1;
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha * 0.9);
      ctx.fillStyle = 'rgba(10, 14, 28, 0.72)';
      ctx.fillRect(36, GAME_HEIGHT - 22, GAME_WIDTH - 72, 16);
      ctx.fillStyle = '#eaf2ff';
      ctx.font = '8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(game.level.hint, GAME_WIDTH * 0.5, GAME_HEIGHT - 11);
      ctx.restore();
    }

    // Boss HP Bar
    if (game.boss && game.boss.alive && game.boss.active) {
      const barW = 180;
      const bx = (GAME_WIDTH - barW) * 0.5;
      const by = 30;
      ctx.fillStyle = 'rgba(10, 12, 24, 0.8)';
      ctx.fillRect(bx - 4, by - 10, barW + 8, 20);
      ctx.fillStyle = '#ff8a9e';
      ctx.font = 'bold 8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PRISM GOLEM — 稜鏡巨像', GAME_WIDTH * 0.5, by - 2);
      ctx.fillStyle = '#2a2238';
      ctx.fillRect(bx, by + 1, barW, 6);
      ctx.fillStyle = game.boss.bossPhase === PHASE.SOLAR ? '#ffae38' : '#4ae3ff';
      ctx.fillRect(bx, by + 1, barW * (game.boss.hp / game.boss.maxHp), 6);
      ctx.textAlign = 'left';
    }
  }

  _drawDebug(ctx, game) {
    const p = game.player;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(6, 40, 146, 56);
    ctx.fillStyle = '#7dffb2';
    ctx.font = '7px monospace';
    ctx.fillText(`FPS: ${game.fps} | ENT: ${game.enemies.length + game.particles.particles.length}`, 10, 50);
    ctx.fillText(`POS: ${p.x.toFixed(1)}, ${p.y.toFixed(1)}`, 10, 60);
    ctx.fillText(`VEL: ${p.vx.toFixed(0)}, ${p.vy.toFixed(0)} | GND:${p.onGround ? 1 : 0}`, 10, 70);
    ctx.fillText(`COYOTE:${p.coyoteTimer.toFixed(2)} BUF:${p.jumpBufferTimer.toFixed(2)}`, 10, 80);
    ctx.fillText(`PHASE:${game.phase.toUpperCase()} DASH:${p.canDash ? 'RDY' : 'CD'}`, 10, 90);
  }

  _drawTitleScreen(ctx, game, time) {
    ctx.fillStyle = 'rgba(7, 9, 20, 0.45)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    const bob = Math.sin(time * 3) * 3;
    ctx.textAlign = 'center';

    // Title
    ctx.font = 'bold 28px monospace';
    ctx.fillStyle = '#140c24';
    ctx.fillText('CHROMA KNIGHT', GAME_WIDTH * 0.5 + 2, 86 + bob + 2);
    ctx.fillStyle = game.phase === PHASE.LUNAR ? '#6ef3ff' : '#ffd561';
    ctx.fillText('CHROMA KNIGHT', GAME_WIDTH * 0.5, 86 + bob);

    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = '#e8f0ff';
    ctx.fillText('— 稜 鏡 騎 士：雙 相 冒 險 —', GAME_WIDTH * 0.5, 106 + bob);

    // Feature badges
    ctx.font = '8px monospace';
    ctx.fillStyle = '#b9c8eb';
    ctx.fillText('熾陽 / 星月即時相位切換  •  8向衝刺  •  蹬牆跳  •  空中重擊  •  稜鏡巨像 BOSS', GAME_WIDTH * 0.5, 134);

    // Animated Start prompt
    const pulse = 0.65 + 0.35 * Math.sin(time * 5);
    ctx.fillStyle = `rgba(255, 240, 160, ${pulse.toFixed(2)})`;
    ctx.font = 'bold 11px monospace';
    ctx.fillText('按 [ENTER] 或 [SPACE] 開始冒險', GAME_WIDTH * 0.5, 174);

    ctx.font = '8px monospace';
    ctx.fillStyle = '#8fa3cf';
    ctx.fillText('快速選關：按 [1] 晨光遺跡  [2] 稜鏡峽谷  [3] 雙相聖殿 (BOSS)', GAME_WIDTH * 0.5, 198);
    ctx.fillText('按 [Shift] 可即時預覽標題雙相光影切換！', GAME_WIDTH * 0.5, 214);
    ctx.textAlign = 'left';
  }

  _drawPauseOverlay(ctx) {
    ctx.fillStyle = 'rgba(6, 8, 18, 0.68)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('PAUSED 暫停中', GAME_WIDTH * 0.5, 122);
    ctx.font = '9px monospace';
    ctx.fillStyle = '#b9c8eb';
    ctx.fillText('[ESC / P] 繼續遊戲    [R] 重玩本關    [1/2/3] 切換關卡', GAME_WIDTH * 0.5, 148);
    ctx.textAlign = 'left';
  }

  _drawStageClear(ctx, game) {
    ctx.fillStyle = 'rgba(6, 10, 22, 0.76)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('STAGE CLEAR!', GAME_WIDTH * 0.5, 88);

    const rank = game.score >= 2200 ? 'S' : game.score >= 1200 ? 'A' : 'B';
    ctx.fillStyle = '#ffffff';
    ctx.font = '10px monospace';
    ctx.fillText(`通關時間：${game.stageTime.toFixed(2)}s    金幣：${game.coins}    分數：${game.score}`, GAME_WIDTH * 0.5, 122);
    ctx.fillStyle = rank === 'S' ? '#4af7c8' : '#ffd561';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`評價 RANK ${rank}`, GAME_WIDTH * 0.5, 152);

    ctx.fillStyle = '#b9c8eb';
    ctx.font = '9px monospace';
    ctx.fillText('按 [ENTER] 或 [SPACE] 進入下一關', GAME_WIDTH * 0.5, 188);
    ctx.textAlign = 'left';
  }

  _drawVictory(ctx, game, time) {
    ctx.fillStyle = 'rgba(8, 10, 24, 0.8)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    ctx.textAlign = 'center';
    ctx.fillStyle = Math.floor(time * 6) % 2 === 0 ? '#ffe066' : '#6ef3ff';
    ctx.font = 'bold 22px monospace';
    ctx.fillText('ALL STAGES CLEARED!', GAME_WIDTH * 0.5, 86);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('你征服了雙相聖殿並擊敗了稜鏡巨像！', GAME_WIDTH * 0.5, 114);
    ctx.font = '10px monospace';
    ctx.fillStyle = '#d4e2ff';
    ctx.fillText(`最終總分：${game.score}    收集金幣：${game.coins}`, GAME_WIDTH * 0.5, 144);
    ctx.fillStyle = '#8effe0';
    ctx.font = '9px monospace';
    ctx.fillText('按 [ENTER] 或 [SPACE] 返回主畫面再戰速通！', GAME_WIDTH * 0.5, 184);
    ctx.textAlign = 'left';
  }

  _drawGameOver(ctx, game) {
    ctx.fillStyle = 'rgba(18, 6, 12, 0.78)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5978';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('FALLEN IN THE CHASM', GAME_WIDTH * 0.5, 110);
    ctx.fillStyle = '#e8ecf8';
    ctx.font = '10px monospace';
    ctx.fillText(`目前分數：${game.score}`, GAME_WIDTH * 0.5, 138);
    ctx.fillStyle = '#ffe066';
    ctx.font = '9px monospace';
    ctx.fillText('按 [SPACE / R] 從檢查點立即重生    [ESC] 回標題', GAME_WIDTH * 0.5, 168);
    ctx.textAlign = 'left';
  }
}

// === src/game.js ===
class Game {
  constructor(atlas, sound, onPhaseChange) {
    this.atlas = atlas;
    this.sound = sound;
    this.onPhaseChange = onPhaseChange;
    this.particles = new ParticleSystem();

    this.state = STATE.TITLE;
    this.stageIndex = 0;
    this.phase = PHASE.SOLAR;
    this.time = 0;
    this.stageTime = 0;
    this.hitstop = 0;
    this.showDebug = false;
    this.fps = 60;

    this.score = 0;
    this.coins = 0;
    this.combo = 0;
    this.comboTimer = 0;

    this.camera = { x: 0, y: 0, shake: 0, shakeX: 0, shakeY: 0 };

    this.level = null;
    this.player = null;
    this.coinsList = [];
    this.hearts = [];
    this.dashCrystals = [];
    this.springs = [];
    this.checkpoints = [];
    this.platforms = [];
    this.enemies = [];
    this.projectiles = [];
    this.boss = null;
    this.input = {};

    // Load Stage 1 in background so title screen has a living world!
    this.loadStage(0, false);
  }

  loadStage(index, enterPlaying = true) {
    this.stageIndex = Math.max(0, Math.min(STAGE_DEFS.length - 1, index));
    const def = STAGE_DEFS[this.stageIndex];
    this.level = new Level(def);
    this.phase = def.startPhase;
    this.stageTime = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.hitstop = 0;

    this.player = new Player(this.level.spawn.x, this.level.spawn.y);
    this.coinsList = [];
    this.hearts = [];
    this.dashCrystals = [];
    this.springs = [];
    this.checkpoints = [];
    this.platforms = [];
    this.enemies = [];
    this.projectiles = [];
    this.boss = null;

    for (const sp of this.level.entitySpawns) {
      switch (sp.type) {
        case 'coin': this.coinsList.push(new Coin(sp.x, sp.y)); break;
        case 'heart': this.hearts.push(new HeartPickup(sp.x, sp.y)); break;
        case 'dash_crystal': this.dashCrystals.push(new DashCrystal(sp.x, sp.y)); break;
        case 'spring': this.springs.push(new Springboard(sp.x, sp.y)); break;
        case 'checkpoint': this.checkpoints.push(new Checkpoint(sp.x, sp.y)); break;
        case 'platform': this.platforms.push(new MovingPlatform(sp.x, sp.y, sp.w, sp.rangeX, sp.rangeY, sp.speed)); break;
        case 'slime': this.enemies.push(new SlimeEnemy(sp.x, sp.y)); break;
        case 'beetle': this.enemies.push(new BeetleEnemy(sp.x, sp.y)); break;
        case 'wisp': this.enemies.push(new WispEnemy(sp.x, sp.y, sp.phase)); break;
        case 'boss': this.boss = new PrismGolemBoss(sp.x, sp.y); break;
      }
    }

    this.particles.clear();
    this.particles.initGrass(this.level);
    this.particles.initAmbient(this.level.widthPx, this.level.heightPx);

    this.camera.x = Math.max(0, this.player.cx - GAME_WIDTH * 0.35);
    this.camera.y = 0;
    this.camera.shake = 0;

    if (this.onPhaseChange) this.onPhaseChange(this.phase);
    if (enterPlaying) {
      this.state = STATE.PLAYING;
      this.sound.setBgmMode(this.phase);
    }
  }

  respawnAtCheckpoint() {
    this.player.reset(this.player.respawnX, this.player.respawnY);
    this.projectiles.length = 0;
    this.combo = 0;
    this.state = STATE.PLAYING;
    this.sound.setBgmMode(this.boss && this.boss.active && this.boss.alive ? 'boss' : this.phase);
    this.particles.burst(this.player.cx, this.player.cy, 16, '#fff3a8', { speedMax: 110, glow: true });
  }

  addShake(amount) {
    this.camera.shake = Math.max(this.camera.shake, amount);
  }

  addScore(pts, x, y, label) {
    this.score += pts;
    if (label) {
      this.particles.spawnText(x, y, label);
    }
  }

  togglePhase() {
    this.phase = this.phase === PHASE.SOLAR ? PHASE.LUNAR : PHASE.SOLAR;
    const isLunar = this.phase === PHASE.LUNAR;
    this.sound.playPhaseShift(isLunar);
    if (!this.boss || !this.boss.active || !this.boss.alive) {
      this.sound.setBgmMode(this.phase);
    }
    if (this.onPhaseChange) this.onPhaseChange(this.phase);

    if (this.player) {
      const col = isLunar ? '#4ae3ff' : '#ffbe44';
      this.particles.spawnRipple(this.player.cx, this.player.cy, col, 220);
      this.particles.burst(this.player.cx, this.player.cy, 14, col, { speedMax: 120, gravity: 0, glow: true });
      this.addShake(2.2);
      this.hitstop = 0.02;
      this._antiCrushPlayer();
    }
  }

  _antiCrushPlayer() {
    const p = this.player;
    const isOverlappingSolid = () => {
      const l = Math.floor(p.x / TILE_SIZE);
      const r = Math.floor((p.x + p.w - 0.01) / TILE_SIZE);
      const t = Math.floor(p.y / TILE_SIZE);
      const b = Math.floor((p.y + p.h - 0.01) / TILE_SIZE);
      for (let ty = t; ty <= b; ty++) {
        for (let tx = l; tx <= r; tx++) {
          if (this.level.isSolid(tx, ty, this.phase)) return true;
        }
      }
      return false;
    };
    if (!isOverlappingSolid()) return;
    // Try nudging upward first so player pops cleanly on top of a materialized phase block
    for (let dy = 1; dy <= 16; dy++) {
      p.y -= 1;
      if (!isOverlappingSolid()) {
        p.vy = Math.min(p.vy, -80);
        return;
      }
    }
    p.y += 16;
  }

  onBlockBump(tx, ty) {
    const t = this.level.getTile(tx, ty);
    const wx = tx * TILE_SIZE + 8;
    const wy = ty * TILE_SIZE + 8;

    if (t === TILE.QUESTION) {
      this.level.setTile(tx, ty, TILE.USED);
      this.level.bumpTile(tx, ty);
      this.coins += 1;
      this.sound.playCoin(this.combo + 1);
      this.addScore(100, wx, wy - 12, '+100');
      this.particles.burst(wx, wy - 8, 10, '#ffe066', { speedMax: 95, glow: true });
      // Every 5th coin from a ? block spawns a Heart if player is hurt!
      if (this.player.hp < this.player.maxHp && Math.random() < 0.45) {
        this.hearts.push(new HeartPickup(wx - 5, wy - 20));
      }
    } else if (t === TILE.BRICK) {
      this.level.setTile(tx, ty, TILE.EMPTY);
      this.sound.playShatter();
      this.addShake(3);
      this.particles.spawnDebris(wx, wy, '#dc7a5c', '#7d302f');
      this.addScore(50, wx, wy - 8, '+50');
    } else {
      this.level.bumpTile(tx, ty);
      this.sound.playBlockBump();
    }
  }

  onPlayerDeath() {
    this.state = STATE.GAME_OVER;
    this.sound.setBgmMode('off');
  }

  update(dt, input) {
    this.input = input;
    this.time += dt;
    this.sound.update(dt);

    // Quick stage shortcuts (1/2/3)
    if (input.stage1) { this.score = 0; this.coins = 0; this.loadStage(0, true); return; }
    if (input.stage2) { this.score = 0; this.coins = 0; this.loadStage(1, true); return; }
    if (input.stage3) { this.score = 0; this.coins = 0; this.loadStage(2, true); return; }

    // Title screen interactive loop
    if (this.state === STATE.TITLE) {
      this.camera.x = (Math.sin(this.time * 0.25) * 0.5 + 0.5) * Math.max(0, this.level.widthPx - GAME_WIDTH);
      this.particles.update(dt, this.time, this.level.widthPx, this.level.heightPx);
      if (input.phasePressed) this.togglePhase();
      if (input.startPressed || input.jumpPressed) {
        this.score = 0;
        this.coins = 0;
        this.loadStage(0, true);
      }
      return;
    }

    if (this.state === STATE.PAUSED) {
      if (input.pausePressed) this.state = STATE.PLAYING;
      if (input.restartPressed) this.loadStage(this.stageIndex, true);
      return;
    }

    if (this.state === STATE.GAME_OVER) {
      this.particles.update(dt, this.time, this.level.widthPx, this.level.heightPx);
      if (input.jumpPressed || input.restartPressed || input.startPressed) {
        this.respawnAtCheckpoint();
      } else if (input.pausePressed) {
        this.state = STATE.TITLE;
      }
      return;
    }

    if (this.state === STATE.STAGE_CLEAR) {
      this.particles.update(dt, this.time, this.level.widthPx, this.level.heightPx);
      if (input.startPressed || input.jumpPressed) {
        this.loadStage(this.stageIndex + 1, true);
      }
      return;
    }

    if (this.state === STATE.VICTORY) {
      this.particles.update(dt, this.time, this.level.widthPx, this.level.heightPx);
      if (input.startPressed || input.jumpPressed) {
        this.state = STATE.TITLE;
        this.loadStage(0, false);
      }
      return;
    }

    // --- PLAYING STATE ---
    if (input.pausePressed) {
      this.state = STATE.PAUSED;
      return;
    }
    if (input.restartPressed) {
      this.loadStage(this.stageIndex, true);
      return;
    }
    if (input.phasePressed) {
      this.togglePhase();
    }

    // Hitstop freeze frames for tactile impact
    if (this.hitstop > 0) {
      this.hitstop -= dt;
      this._updateCamera(dt);
      return;
    }

    this.stageTime += dt;
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.combo = 0;
    }

    this.level.update(dt, this.particles);

    for (const p of this.platforms) p.update(dt);
    this.player.update(dt, input, this);
    for (const s of this.springs) s.update(dt, this.player, this);
    for (const cp of this.checkpoints) cp.update(dt, this.player, this);
    for (const c of this.coinsList) c.update(dt, this.time, this.player, this);
    for (const h of this.hearts) h.update(dt, this.time, this.player, this);
    for (const d of this.dashCrystals) d.update(dt, this.time, this.player, this);
    for (const e of this.enemies) e.update(dt, this.player, this);
    if (this.boss && this.boss.alive) {
      this.boss.update(dt, this.player, this);
    }
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      this.projectiles[i].update(dt, this.player, this);
      if (!this.projectiles[i].alive) this.projectiles.splice(i, 1);
    }

    // Check Goal Portal
    const gx = this.level.goal.x;
    const gy = this.level.goal.y;
    const bossBlocking = this.boss && this.boss.alive;
    if (
      !bossBlocking &&
      Math.abs(this.player.cx - (gx + 8)) < 16 &&
      Math.abs(this.player.cy - (gy - 4)) < 24
    ) {
      this.sound.playVictory();
      this.sound.setBgmMode('off');
      this.addScore(1000, gx + 8, gy - 16, 'CLEAR +1000!');
      this.particles.burst(gx + 8, gy - 4, 34, '#ffe066', { speedMax: 180, glow: true });
      if (this.stageIndex >= STAGE_DEFS.length - 1) {
        this.state = STATE.VICTORY;
      } else {
        this.state = STATE.STAGE_CLEAR;
      }
    }

    this.particles.update(dt, this.time, this.level.widthPx, this.level.heightPx);
    this._updateCamera(dt);
  }

  _updateCamera(dt) {
    if (this.player) {
      const lookAhead = this.player.facing * 36;
      const targetX = Math.max(
        0,
        Math.min(this.level.widthPx - GAME_WIDTH, this.player.cx + lookAhead - GAME_WIDTH * 0.44)
      );
      const targetY = Math.max(
        0,
        Math.min(this.level.heightPx - GAME_HEIGHT, this.player.cy - GAME_HEIGHT * 0.56)
      );
      this.camera.x += (targetX - this.camera.x) * Math.min(1, dt * 7.5);
      this.camera.y += (targetY - this.camera.y) * Math.min(1, dt * 6);
    }

    if (this.camera.shake > 0.1) {
      this.camera.shakeX = (Math.random() - 0.5) * this.camera.shake * 2;
      this.camera.shakeY = (Math.random() - 0.5) * this.camera.shake * 2;
      this.camera.shake *= Math.pow(0.001, dt);
    } else {
      this.camera.shake = 0;
      this.camera.shakeX = 0;
      this.camera.shakeY = 0;
    }
  }
}

// === src/main.js ===
const canvas = document.getElementById('game');
const canvasWrap = document.getElementById('canvas-wrap');
const crtOverlay = document.getElementById('crt-overlay');
const phasePill = document.getElementById('phase-pill');

const sound = new SoundEngine();
const atlas = createSpriteAtlas();
const renderer = new Renderer(canvas, atlas);

function syncPhaseUI(phase) {
  const isLunar = phase === PHASE.LUNAR;
  canvasWrap.classList.toggle('phase-lunar', isLunar);
  canvasWrap.classList.toggle('phase-solar', !isLunar);
  phasePill.className = `badge ${isLunar ? 'lunar' : 'solar'}`;
  phasePill.textContent = isLunar ? 'LUNAR 星月' : 'SOLAR 熾陽';
}

const game = new Game(atlas, sound, syncPhaseUI);

// --- INPUT MANAGER (Keyboard + Gamepad) ---
const keys = new Set();
const justPressed = new Set();

const PREVENT_KEYS = new Set([
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'F3',
]);

window.addEventListener('keydown', (e) => {
  sound.unlock();
  if (PREVENT_KEYS.has(e.code)) e.preventDefault();
  if (!keys.has(e.code)) {
    justPressed.add(e.code);
  }
  keys.add(e.code);

  if (e.code === 'KeyM') {
    sound.toggleMute();
  } else if (e.code === 'KeyV') {
    crtOverlay.classList.toggle('crt-on');
  } else if (e.code === 'F3') {
    game.showDebug = !game.showDebug;
  }
});

window.addEventListener('keyup', (e) => {
  keys.delete(e.code);
});

window.addEventListener('blur', () => {
  keys.clear();
});

canvas.addEventListener('pointerdown', () => {
  sound.unlock();
});

let prevPadButtons = [];
function readInput() {
  const anyDown = (...codes) => codes.some((c) => keys.has(c));
  const anyPressed = (...codes) => codes.some((c) => justPressed.has(c));

  const input = {
    left: anyDown('ArrowLeft', 'KeyA'),
    right: anyDown('ArrowRight', 'KeyD'),
    up: anyDown('ArrowUp', 'KeyW'),
    down: anyDown('ArrowDown', 'KeyS'),
    downPressed: anyPressed('ArrowDown', 'KeyS'),
    jump: anyDown('Space', 'KeyZ', 'KeyW', 'ArrowUp'),
    jumpPressed: anyPressed('Space', 'KeyZ', 'KeyW', 'ArrowUp'),
    dashPressed: anyPressed('KeyX', 'KeyJ'),
    phasePressed: anyPressed('ShiftLeft', 'ShiftRight', 'KeyK', 'KeyE'),
    startPressed: anyPressed('Enter'),
    pausePressed: anyPressed('Escape', 'KeyP'),
    restartPressed: anyPressed('KeyR'),
    stage1: anyPressed('Digit1'),
    stage2: anyPressed('Digit2'),
    stage3: anyPressed('Digit3'),
  };

  // Optional Gamepad support
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = pads[0];
  if (gp) {
    const btn = (i) => Boolean(gp.buttons[i] && gp.buttons[i].pressed);
    const btnPressed = (i) => btn(i) && !prevPadButtons[i];

    if (gp.axes[0] < -0.35 || btn(14)) input.left = true;
    if (gp.axes[0] > 0.35 || btn(15)) input.right = true;
    if (gp.axes[1] < -0.45 || btn(12)) input.up = true;
    if (gp.axes[1] > 0.55 || btn(13)) input.down = true;

    if (btn(0)) input.jump = true;
    if (btnPressed(0)) input.jumpPressed = true;
    if (btnPressed(2) || btnPressed(1)) input.dashPressed = true;
    if (btnPressed(3) || btnPressed(4) || btnPressed(5)) input.phasePressed = true;
    if (btnPressed(9)) input.startPressed = true;

    prevPadButtons = gp.buttons.map((b) => Boolean(b.pressed));
  }

  justPressed.clear();
  return input;
}

// --- FIXED TIMESTEP GAME LOOP (60Hz physics, smooth RAF render) ---
const STEP = 1 / 60;
let accumulator = 0;
let lastTime = performance.now();
let frames = 0;
let fpsTimer = 0;

function loop(now) {
  const rawDt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  frames += 1;
  fpsTimer += rawDt;
  if (fpsTimer >= 0.5) {
    game.fps = Math.round(frames / fpsTimer);
    frames = 0;
    fpsTimer = 0;
  }

  accumulator += rawDt;
  let stepped = false;
  while (accumulator >= STEP) {
    const input = readInput();
    game.update(STEP, input);
    accumulator -= STEP;
    stepped = true;
  }
  if (!stepped) {
    // Keep title / responsive visual state clean
  }

  renderer.render(game);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

})();
